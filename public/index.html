<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: 'Courier New', monospace; background: #0a0a15; color: #fff; overflow: hidden; }
        
        #mainContainer { display: flex; width: 100%; height: 100%; }
        
        #lobbyScreen { display: flex; width: 100%; height: 100%; padding: 40px; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%); }
        #lobby { text-align: center; }
        .lobby-header h1 { font-size: 3em; color: #00ff88; margin-bottom: 30px; }
        .lobby-content { background: rgba(0, 0, 0, 0.3); border: 2px solid #00ff88; padding: 40px; border-radius: 8px; max-width: 400px; }
        .lobby-content h2 { color: #00ff88; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: #00ffff; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(0, 255, 255, 0.1); border: 1px solid #0064ff; color: #fff; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 1em; }
        button { background: linear-gradient(135deg, #00ff88 0%, #00ffff 100%); color: #000; border: none; padding: 12px 30px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; font-size: 1em; }
        button:hover { transform: scale(1.05); }
        
        #gameContainer { display: none; width: 100%; height: 100%; flex-direction: column; }
        
        #topHUD { background: rgba(0, 0, 0, 0.8); border-bottom: 2px solid #00ff88; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-shrink: 0; height: 140px; }
        
        #playerInfoBox { background: rgba(0, 0, 0, 0.5); border: 2px solid #00ff88; border-radius: 4px; padding: 10px 15px; }
        #playerInfoBox h3 { color: #00ff88; margin-bottom: 8px; font-size: 0.9em; }
        #playerStats { display: flex; gap: 20px; align-items: center; }
        
        .stat-group { display: flex; flex-direction: column; gap: 3px; }
        .stat-group .label { color: #00ffff; font-size: 0.8em; }
        
        .health-bar { width: 100px; height: 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid #ff3333; border-radius: 2px; overflow: hidden; }
        .health-fill { height: 100%; background: #00ff88; transition: width 0.1s; }
        
        .ammo-bar { width: 100px; height: 20px; background: rgba(0, 0, 0, 0.5); border: 1px solid #00ffff; border-radius: 2px; overflow: hidden; }
        .ammo-fill { height: 100%; background: #00ff88; transition: width 0.1s; }
        
        #teamScores { display: flex; gap: 15px; }
        .team-score { padding: 8px 12px; border: 2px solid; border-radius: 4px; background: rgba(0, 0, 0, 0.5); font-weight: bold; min-width: 120px; text-align: center; }
        .team-blue { border-color: #0099ff; color: #0099ff; }
        .team-red { border-color: #ff3333; color: #ff3333; }
        .team-yellow { border-color: #ffff00; color: #ffff00; }
        .team-green { border-color: #00ff88; color: #00ff88; }
        
        #playerList { background: rgba(0, 0, 0, 0.5); border: 2px solid #00ff88; border-radius: 4px; padding: 10px 15px; max-height: 120px; overflow-y: auto; max-width: 400px; }
        #playerList h3 { color: #00ff88; margin-bottom: 8px; font-size: 0.9em; }
        .player-entry { display: flex; gap: 15px; align-items: center; margin-bottom: 6px; padding: 4px; background: rgba(0, 255, 136, 0.05); border-left: 2px solid; border-radius: 2px; font-size: 0.85em; }
        .player-name { color: #00ffff; font-weight: bold; min-width: 100px; }
        .player-health { color: #ff3333; min-width: 50px; }
        .player-ammo { color: #00ffff; min-width: 40px; }
        
        #gameArea { flex: 1; width: 100%; display: block; position: relative; overflow: hidden; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        
        .leave-btn { position: absolute; bottom: 15px; right: 15px; z-index: 10; }
    </style>
</head>
<body>
    <div id="mainContainer">
        <div id="lobbyScreen">
            <div id="lobby">
                <div class="lobby-header">
                    <h1>⚔ TANK BATTLE ⚔</h1>
                </div>
                <div class="lobby-content">
                    <h2>Gå med i spel</h2>
                    <div class="form-group">
                        <label>Spelarnamn</label>
                        <input type="text" id="playerName" value="Player" placeholder="Ditt namn">
                    </div>
                    <div class="form-group">
                        <label>Lag</label>
                        <select id="teamIndex">
                            <option value="0">🔵 Blå</option>
                            <option value="1">🔴 Röd</option>
                            <option value="2">🟡 Gul</option>
                            <option value="3">🟢 Grön</option>
                        </select>
                    </div>
                    <button onclick="joinGame()" style="width: 100%;">Spela</button>
                </div>
            </div>
        </div>

        <div id="gameContainer">
            <div id="topHUD">
                <div id="playerInfoBox">
                    <h3>Din Tank</h3>
                    <div id="playerStats">
                        <div class="stat-group">
                            <span class="label">HP</span>
                            <div class="health-bar"><div class="health-fill" id="hpFill" style="width: 100%;"></div></div>
                        </div>
                        <div class="stat-group">
                            <span class="label">AMMO</span>
                            <div class="ammo-bar"><div class="ammo-fill" id="ammoFill" style="width: 100%;"></div></div>
                        </div>
                    </div>
                </div>

                <div id="teamScores">
                    <div class="team-score team-blue">BLÅ: <span id="scoreBlue">0</span></div>
                    <div class="team-score team-red">RÖD: <span id="scoreRed">0</span></div>
                    <div class="team-score team-yellow">GUL: <span id="scoreYellow">0</span></div>
                    <div class="team-score team-green">GRÖN: <span id="scoreGreen">0</span></div>
                </div>

                <div id="playerList">
                    <h3>Spelare</h3>
                    <div id="playerListContent"></div>
                </div>
            </div>

            <div id="gameArea">
                <canvas id="gameCanvas"></canvas>
                <button id="startGameBtn" onclick="startGame()" class="leave-btn" style="right: 150px;">Starta spel</button>
                <button onclick="leaveGame()" class="leave-btn">Lämna</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket;
        let gameState = null;
        let currentGameId = null;
        let currentPlayerId = null;
        let isPlaying = false;
        let explosions = []; // Track explosions locally

        const teamColors = ['#0099ff', '#ff3333', '#ffff00', '#00ff88'];
        const teamColorsArray = ['blue', 'red', 'yellow', 'green'];

        // Pre-load shoot sound
        const shootSound = new Audio('/smg.mp3');
        shootSound.volume = 0.3;
        shootSound.preload = 'auto';

        // Cookie-funktioner
        function setCookie(name, value, days = 7) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return cookie.substring(nameEQ.length);
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        function initSocket() {
            if (typeof io === 'undefined') {
                setTimeout(initSocket, 100);
                return;
            }

            socket = io();

            socket.on('connect', () => {
                console.log('Connected');
                
                // Försök reconnect till tidigare spel
                const savedGameId = getCookie('gameId');
                const savedPlayerId = getCookie('playerId');
                const savedName = getCookie('playerName');
                const savedTeam = getCookie('teamIndex');

                if (savedGameId && savedPlayerId && savedName) {
                    console.log('Attempting to reconnect...');
                    socket.emit('reconnectPlayer', {
                        gameId: savedGameId,
                        playerId: savedPlayerId,
                        name: savedName,
                        teamIndex: parseInt(savedTeam)
                    }, success => {
                        if (success) {
                            currentGameId = savedGameId;
                            currentPlayerId = savedPlayerId;
                            isPlaying = true;
                            document.getElementById('lobbyScreen').style.display = 'none';
                            document.getElementById('gameContainer').style.display = 'flex';
                            setTimeout(() => {
                                canvas.width = document.getElementById('gameArea').clientWidth;
                                canvas.height = document.getElementById('gameArea').clientHeight;
                            }, 50);
                        }
                    });
                }
            });

            socket.on('gameStateUpdate', (state) => {
                // Hitta döda spelare och skapa explosioner
                if (gameState && gameState.players) {
                    gameState.players.forEach(oldPlayer => {
                        const newPlayer = state.players.find(p => p.id === oldPlayer.id);
                        if (newPlayer && oldPlayer.hp > 0 && newPlayer.hp <= 0) {
                            // Spelare dog just nu - skapa explosion
                            explosions.push({
                                x: newPlayer.x,
                                y: newPlayer.y,
                                age: 0,
                                maxAge: 20
                            });
                        }
                    });
                }
                gameState = state;
                updateUI();
            });

            socket.on('shotFired', () => {
                try {
                    shootSound.currentTime = 0;
                    shootSound.play().catch(() => {});
                } catch (e) {
                    console.log('Sound play error:', e);
                }
            });
        }

        function joinGame() {
            if (!socket) return;
            const name = document.getElementById('playerName').value || 'Player';
            const teamIndex = parseInt(document.getElementById('teamIndex').value);

            socket.emit('getGames', games => {
                let gameId = null;
                let foundExistingGame = false;
                
                // Hitta ett spel som inte är fullt
                for (let game of games) {
                    if (game.playerCount < 8) {
                        gameId = game.id;
                        foundExistingGame = true;
                        break;
                    }
                }

                // Om inget spel finns, skapa ett nytt
                if (!gameId) {
                    socket.emit('createGame', 0, id => {
                        joinGameImpl(id, name, teamIndex, true); // true = är skapare
                    });
                } else {
                    joinGameImpl(gameId, name, teamIndex, false); // false = är inte skapare
                }
            });
        }

        function joinGameImpl(gameId, name, teamIndex, isCreator) {
            socket.emit('joinGame', gameId, {
                name: name,
                teamIndex: teamIndex,
                tankType: 'Classic'
            }, result => {
                if (result.success) {
                    currentGameId = gameId;
                    currentPlayerId = result.playerId;
                    isPlaying = true;
                    
                    // Spara cookies
                    setCookie('gameId', gameId, 7);
                    setCookie('playerId', result.playerId, 7);
                    setCookie('playerName', name, 7);
                    setCookie('teamIndex', teamIndex, 7);
                    
                    document.getElementById('lobbyScreen').style.display = 'none';
                    document.getElementById('gameContainer').style.display = 'flex';
                    
                    // Visa/dölj startGame-knapp baserat på om du är skapare
                    const startBtn = document.getElementById('startGameBtn');
                    if (isCreator) {
                        startBtn.style.display = 'block';
                    } else {
                        startBtn.style.display = 'none';
                    }
                    
                    setTimeout(() => {
                        canvas.width = document.getElementById('gameArea').clientWidth;
                        canvas.height = document.getElementById('gameArea').clientHeight;
                    }, 50);
                } else {
                    alert('Kunde inte gå med i spelet: ' + (result.error || 'Okänt fel'));
                }
            });
        }

        function leaveGame() {
            isPlaying = false;
            currentGameId = null;
            currentPlayerId = null;
            
            // Ta bort cookies
            deleteCookie('gameId');
            deleteCookie('playerId');
            deleteCookie('playerName');
            deleteCookie('teamIndex');
            
            document.getElementById('lobbyScreen').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'none';
            if (socket) {
                socket.disconnect();
                setTimeout(() => socket.connect(), 500);
            }
        }

        function startGame() {
            if (!socket || !currentGameId) return;
            socket.emit('startGame', currentGameId, (result) => {
                if (!result.success) {
                    alert('Kunde inte starta spelet: ' + (result.error || 'Okänt fel'));
                }
            });
        }

        function drawTank(ctx, x, y, angle, colorIndex) {
            const color = teamColors[colorIndex];
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle + Math.PI / 2);
            
            ctx.fillStyle = color;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.fillRect(-10, -14, 20, 28);
            ctx.strokeRect(-10, -14, 20, 28);
            
            ctx.beginPath();
            ctx.arc(0, -2, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#666666';
            ctx.fillRect(-2, -14, 4, 12);
            ctx.strokeRect(-2, -14, 4, 12);
            
            ctx.fillStyle = '#333333';
            ctx.beginPath();
            ctx.arc(0, -14, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }

        function render() {
            if (!canvas.width || !canvas.height) return;
            
            if (!gameState) {
                ctx.fillStyle = '#2a3a4a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const mapWidth = 1400;
            const mapHeight = 600;

            ctx.fillStyle = '#2a3a4a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState.players.length === 0) return;

            const scaleX = canvas.width / mapWidth;
            const scaleY = canvas.height / mapHeight;
            const scale = Math.min(scaleX, scaleY);
            const offsetX = (canvas.width - mapWidth * scale) / 2;
            const offsetY = (canvas.height - mapHeight * scale) / 2;

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Draw map
            ctx.fillStyle = '#444444';
            ctx.fillRect(0, 0, mapWidth, mapHeight);
            ctx.fillStyle = '#2a3a4a';
            ctx.fillRect(20, 20, mapWidth - 40, mapHeight - 40);

            // Draw obstacles - labyrint based on image
            ctx.fillStyle = '#555555';
            // Top-left
            ctx.fillRect(100, 100, 100, 10);
            ctx.fillRect(100, 100, 10, 150);
            ctx.fillRect(100, 240, 100, 10);
            ctx.fillRect(190, 100, 10, 140);
            
            // Top-middle
            ctx.fillRect(250, 100, 100, 10);
            ctx.fillRect(250, 100, 10, 150);
            ctx.fillRect(340, 100, 10, 140);
            
            // Top-right
            ctx.fillRect(400, 100, 250, 10);
            ctx.fillRect(640, 100, 10, 200);
            ctx.fillRect(400, 190, 50, 10);
            ctx.fillRect(480, 140, 10, 150);
            ctx.fillRect(550, 140, 10, 150);
            
            // Middle-left
            ctx.fillRect(100, 320, 100, 10);
            ctx.fillRect(190, 280, 10, 140);
            ctx.fillRect(100, 420, 100, 10);
            
            // Middle-center
            ctx.fillRect(250, 310, 10, 170);
            ctx.fillRect(250, 310, 100, 10);
            ctx.fillRect(340, 250, 10, 170);
            ctx.fillRect(250, 480, 90, 10);
            
            // Center maze
            ctx.fillRect(450, 250, 10, 180);
            ctx.fillRect(450, 250, 100, 10);
            ctx.fillRect(540, 250, 10, 100);
            ctx.fillRect(520, 330, 50, 10);
            ctx.fillRect(550, 310, 10, 50);
            
            // Right section
            ctx.fillRect(750, 100, 10, 400);
            ctx.fillRect(750, 240, 100, 10);
            ctx.fillRect(750, 350, 100, 10);
            ctx.fillRect(830, 140, 10, 220);
            ctx.fillRect(830, 360, 10, 140);
            
            // Bottom
            ctx.fillRect(200, 500, 10, 80);
            ctx.fillRect(350, 520, 200, 10);
            ctx.fillRect(450, 450, 10, 80);
            ctx.fillRect(600, 500, 10, 80);
            
            // Center obstacle
            ctx.fillRect(600, 300, 50, 50);

            // Draw spawn zones (semi-transparent)
            ctx.fillStyle = 'rgba(0, 153, 255, 0.1)';
            ctx.fillRect(50, 70, 60, 450); // Blå - vänster
            
            ctx.fillStyle = 'rgba(255, 51, 51, 0.1)';
            ctx.fillRect(1290, 70, 60, 450); // Röd - höger
            
            ctx.fillStyle = 'rgba(255, 255, 0, 0.1)';
            ctx.fillRect(200, 50, 1000, 60); // Gul - topp
            
            ctx.fillStyle = 'rgba(0, 255, 136, 0.1)';
            ctx.fillRect(200, 540, 1000, 60); // Grön - botten

            // Draw projectiles
            if (gameState.projectiles && gameState.projectiles.length > 0) {
                gameState.projectiles.forEach(p => {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 10);
                    grad.addColorStop(0, 'rgba(255, 255, 0, 1)');
                    grad.addColorStop(0.6, 'rgba(255, 200, 0, 0.5)');
                    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw explosions
            explosions = explosions.filter(exp => {
                if (exp.age >= exp.maxAge) return false;
                
                const radius = (exp.age / exp.maxAge) * 60;
                const alpha = 1 - (exp.age / exp.maxAge);
                
                // Outer ring
                ctx.fillStyle = `rgba(255, 100, 0, ${alpha * 0.8})`;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner glow
                ctx.fillStyle = `rgba(255, 200, 0, ${alpha})`;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                
                exp.age++;
                return true;
            });

            // Draw players
            if (gameState.players) {
                gameState.players.forEach(player => {
                    drawTank(ctx, player.x, player.y, player.angle, player.teamIndex);
                });
            }

            ctx.restore();
        }

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        setInterval(() => {
            if (isPlaying && currentGameId && socket) {
                if (keys['w']) socket.emit('movePlayer', 'forward', currentGameId);
                if (keys['s']) socket.emit('movePlayer', 'backward', currentGameId);
                if (keys['a']) socket.emit('movePlayer', 'left', currentGameId);
                if (keys['d']) socket.emit('movePlayer', 'right', currentGameId);
            }
        }, 50);

        canvas.addEventListener('click', () => {
            if (isPlaying && socket) socket.emit('shoot', currentGameId);
        });

        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            if (isPlaying && socket) socket.emit('reload', currentGameId);
        });

        function updateUI() {
            if (!gameState) return;

            const player = gameState.players.find(p => p.id === currentPlayerId);
            if (player) {
                document.getElementById('hpFill').style.width = (player.hp / 100 * 100) + '%';
                document.getElementById('ammoFill').style.width = (player.ammo / 10 * 100) + '%';
            }

            document.getElementById('scoreBlue').textContent = gameState.scores[0];
            document.getElementById('scoreRed').textContent = gameState.scores[1];
            document.getElementById('scoreYellow').textContent = gameState.scores[2];
            document.getElementById('scoreGreen').textContent = gameState.scores[3];

            const listContent = document.getElementById('playerListContent');
            listContent.innerHTML = gameState.players
                .map(p => `<div class="player-entry">
                    <span class="player-name" style="color: ${teamColors[p.teamIndex]}">${p.name}</span>
                    <span class="player-health">HP:${p.hp}</span>
                    <span class="player-ammo">A:${p.ammo}</span>
                </div>`)
                .join('');
        }

        initSocket();
    </script>
</body>
</html>
