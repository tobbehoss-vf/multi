<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doom-ish PvP (Render: HTML + WS)</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; image-rendering: crisp-edges; }

    #ui {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font: 16px system-ui, -apple-system, Segoe UI, Roboto, Arial; color:#fff;
      background: rgba(0,0,0,.55);
      user-select:none;
      z-index: 10;
    }
    #ui .box {
      max-width: 780px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.35);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #ui h1 { margin:0 0 10px; font-size: 20px; }
    #ui p { margin:8px 0; opacity:.92; line-height:1.5; }
    #ui .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    #ui label { opacity:.9; }
    #ui input {
      width: 220px; padding: 9px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color:#fff;
      outline:none;
    }
    #ui button {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.14); color:#fff;
      cursor:pointer;
    }
    #ui button:hover { background: rgba(255,255,255,.18); }

    #weapon { display: none; }
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      width: 0; height: 0;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.92);
    }
    #crosshair::before {
      width: 16px; height: 2px;
      left: -8px; top: -1px;
    }
    #crosshair::after {
      width: 2px; height: 16px;
      left: -1px; top: -8px;
    }

    /* Hit flash overlay */
    #hitflash {
      position: fixed; inset:0;
      pointer-events:none;
      z-index:7;
      background: rgba(220,0,0,0);
      transition: background 0.08s;
    }

    /* Bottom Doom-style HUD bar */
    #hud-bar {
      position: fixed; bottom:0; left:0; right:0;
      height: 56px;
      background: #1a0000;
      border-top: 3px solid #550000;
      display: flex; align-items: center;
      padding: 0 24px;
      gap: 32px;
      z-index: 5;
      pointer-events: none;
      font: bold 28px ui-monospace, monospace;
      color: #ff4400;
      text-shadow: 0 0 8px #ff2200;
    }
    .hud-item { display:flex; flex-direction:column; align-items:center; }
    .hud-label { font-size:9px; letter-spacing:2px; color:#ff6600; opacity:0.7; font-weight:normal; margin-bottom:1px; }
    .hud-value { line-height:1; }
    #hud-face {
      width:44px; height:44px; background:#cc2200;
      border:2px solid #881100; border-radius:2px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px;
    }
    #hud-room {
      font-size:11px; letter-spacing:2px; color:#ff8800;
      opacity:0.6; margin-left:auto; font-weight:normal;
    }
    #toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      color:#fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
      padding: 8px 10px; border-radius: 12px; font: 13px system-ui;
      opacity: 0; transition: opacity .2s ease;
      pointer-events:none;
      z-index: 6;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="ui">
    <div class="box">
      <h1>Doom-ish PvP</h1>
      <p class="row">
        <label>Namn:</label>
        <input id="name" maxlength="16" placeholder="Ditt namn" />
        <label>Rum:</label>
        <input id="room" maxlength="16" value="lobby" />
        <button id="join">Join</button>
      </p>
      <p><b>W</b>=framåt • <b>S</b>=bakåt • <b>A</b>=vänster • <b>D</b>=höger • <b>Mus</b>=sikta • <b>Klick</b>=skjut • <b>ESC</b>=meny</p>
      <p style="opacity:.78">Doom-känsla: hög fart + “slide”. (Inga hopp.)</p>
      <p id="status" style="opacity:.9"></p>
    </div>
  </div>

  <div id="hitflash"></div>
  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <img id="weapon" alt="weapon" />

  <!-- Doom-style HUD bar -->
  <div id="hud-bar">
    <div class="hud-item">
      <div class="hud-label">HÄLSA</div>
      <div class="hud-value" id="hud-hp">100</div>
    </div>
    <div id="hud-face">😐</div>
    <div class="hud-item">
      <div class="hud-label">AMMO</div>
      <div class="hud-value" id="hud-ammo">50</div>
    </div>
    <div class="hud-item" style="font-size:16px">
      <div class="hud-label">SPELARE</div>
      <div class="hud-value" id="hud-players">–</div>
    </div>
    <div id="hud-room">OFFLINE</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    // =========================
    // WebSocket URL (same origin)
    // =========================
    const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

    // =========================
    // Renderer (full resolution)
    // =========================
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:"high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.autoClear = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // Ljusare, mjuk dimma
    scene.fog = new THREE.Fog(0x1a1820, 18, 120);
    scene.background = new THREE.Color(0x1a1820);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);

    // Ljussättning (ljusare än tidigare)
    scene.add(new THREE.AmbientLight(0xffffff, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(6, 12, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(-6, 8, -4);
    scene.add(fill);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    // =========================
    // UI
    // =========================
    const ui = document.getElementById("ui");
    const statusEl = document.getElementById("status");
    const hud = document.getElementById("hud");
    const toast = document.getElementById("toast");
    const weaponImg = document.getElementById("weapon");

    function showToast(text){
      toast.textContent = text;
      toast.style.opacity = "1";
      setTimeout(()=> toast.style.opacity = "0", 900);
    }

    controls.addEventListener("lock", () => { ui.style.display = "none"; });
    controls.addEventListener("unlock", () => { ui.style.display = "flex"; });

    // Deklarera connected tidigt så UI-klick-handler kan använda den
    let connected = false;

    ui.addEventListener("click", (e)=>{
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "LABEL") return;
      if (connected) controls.lock();
    });

    // =========================
    // 3D VAPEN – barn till kameran, följer alltid med
    // =========================
    const weaponGroup = new THREE.Group();

    const mDark  = new THREE.MeshLambertMaterial({ color: 0x1a1a1f });
    const mMid   = new THREE.MeshLambertMaterial({ color: 0x2e2e36 });
    const mLight = new THREE.MeshLambertMaterial({ color: 0x585860 });
    const mWood  = new THREE.MeshLambertMaterial({ color: 0x3e2010 });
    const mWoodL = new THREE.MeshLambertMaterial({ color: 0x6e4020 });
    const mHand  = new THREE.MeshLambertMaterial({ color: 0xb86030 });
    const mHandL = new THREE.MeshLambertMaterial({ color: 0xd07848 });

    function addBox(w,h,d, mat, x,y,z){
      const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
      m.position.set(x,y,z);
      weaponGroup.add(m);
    }

    // Pipa – pekar mot -Z (framåt)
    addBox(0.055, 0.055, 1.1,  mDark,   0,       0.005,  -0.55);
    addBox(0.035, 0.008, 1.08, mLight,  0,       0.034,  -0.55); // reflex-list
    // Underpipa
    addBox(0.042, 0.042, 0.78, mDark,   0,      -0.052,  -0.39);
    // Receiver
    addBox(0.11,  0.10,  0.28, mDark,   0,       0.005,   0.08);
    addBox(0.085, 0.065, 0.24, mMid,    0,       0.010,   0.08);
    addBox(0.08,  0.010, 0.22, mLight,  0,       0.052,   0.07); // reflex
    // Pump (trä)
    addBox(0.10,  0.068, 0.22, mWood,   0,      -0.018,  -0.22);
    addBox(0.076, 0.040, 0.18, mWoodL,  0,      -0.008,  -0.22);
    // Kolv (trä)
    addBox(0.088, 0.088, 0.26, mWood,   0,      -0.004,   0.29);
    addBox(0.068, 0.060, 0.22, mWoodL,  0,       0.004,   0.28);
    addBox(0.092, 0.092, 0.014,mDark,   0,      -0.004,   0.42); // kolfplatta
    // Pistolgrepp
    addBox(0.065, 0.13,  0.08, mWood,   0.006, -0.085,   0.12);
    addBox(0.046, 0.10,  0.06, mWoodL,  0.006, -0.072,   0.12);
    // Höger hand
    addBox(0.088, 0.095, 0.13, mHand,   0.042, -0.098,   0.14);
    addBox(0.065, 0.068, 0.10, mHandL,  0.042, -0.088,   0.14);
    addBox(0.022, 0.065, 0.022,mHand,   0.018, -0.155,   0.10); // finger 1
    addBox(0.022, 0.065, 0.022,mHand,   0.042, -0.158,   0.10); // finger 2
    addBox(0.022, 0.060, 0.022,mHand,   0.066, -0.152,   0.10); // finger 3
    addBox(0.018, 0.050, 0.022,mHand,   0.088, -0.144,   0.10); // finger 4
    addBox(0.022, 0.048, 0.048,mHand,   0.004, -0.068,   0.08); // tumme
    // Vänster hand (pump)
    addBox(0.088, 0.075, 0.15, mHand,   0.042, -0.055,  -0.22);
    addBox(0.065, 0.055, 0.12, mHandL,  0.042, -0.048,  -0.22);
    addBox(0.022, 0.058, 0.022,mHand,   0.018, -0.115,  -0.26); // finger 1
    addBox(0.022, 0.058, 0.022,mHand,   0.042, -0.118,  -0.26); // finger 2
    addBox(0.022, 0.052, 0.022,mHand,   0.066, -0.112,  -0.26); // finger 3
    addBox(0.018, 0.044, 0.022,mHand,   0.088, -0.105,  -0.26); // finger 4

    // Vapnet placeras relativt kameran – nere till höger, pekar framåt
    weaponGroup.position.set(0.22, -0.20, -0.30);
    weaponGroup.rotation.y = 0.06;
    weaponGroup.visible = false;

    // NYCKELN: lägg vapnet som barn till kameran → följer alltid med
    camera.add(weaponGroup);

    // Separata vapenljus i världsscenen (påverkar vapnet via Lambert)
    const wKeyLight = new THREE.PointLight(0xffffff, 1.5, 3);
    wKeyLight.position.set(0.3, 0.2, -0.1);
    camera.add(wKeyLight);

    // ── MUZZLE FLASH – PointLight + sprite vid pipspetsen ───────────────────
    // Pipspetsen sitter på z = -0.55 - 0.55 = -1.1 i weaponGroup-space
    const muzzleLight = new THREE.PointLight(0xff8800, 0, 6); // intensity=0 tills skott
    muzzleLight.position.set(0, 0.005, -1.1);
    weaponGroup.add(muzzleLight);

    // Muzzle flash sprite (gul starburst)
    const muzzleSpriteMat = new THREE.SpriteMaterial({
      color: 0xffcc44,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const muzzleSprite = new THREE.Sprite(muzzleSpriteMat);
    muzzleSprite.scale.set(0.25, 0.25, 1);
    muzzleSprite.position.set(0, 0.005, -1.1);
    weaponGroup.add(muzzleSprite);

    let muzzleFlashLife = 0;

    // Vapen-bob variabler
    let weaponBobT = 0;
    let weaponKick = 0;

    // Vapenscen för separat djup-pass
    const weaponScene = new THREE.Scene();
    const weaponCamera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 10);
    // weaponCamera behöver inte röra sig – vapnet är relativt kameran i weaponScene
    // Vi kopierar kamerans world-transform till weaponCamera varje frame
    weaponScene.add(weaponCamera);
    const weaponGroupCopy = weaponGroup.clone();
    weaponGroupCopy.visible = true;
    weaponScene.add(weaponGroupCopy);
    weaponScene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const wSceneLight = new THREE.DirectionalLight(0xffffff, 2.0);
    wSceneLight.position.set(1, 2, 2);
    weaponScene.add(wSceneLight);

    controls.addEventListener("lock", () => { weaponGroup.visible = true; weaponGroupCopy.visible = true; });
    controls.addEventListener("unlock", () => { weaponGroup.visible = false; weaponGroupCopy.visible = false; });

    // ── BULLET TRACERS (visuella skott i 3D) ────────────────────────────────
    const tracers = [];

    function spawnTracer(from, dir){
      const geo = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 4);
      geo.rotateX(Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffee44 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(from);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir.clone().normalize());
      scene.add(mesh);
      tracers.push({ mesh, dir: dir.clone().normalize(), life: 0.12, speed: 80 });
    }

    function updateTracers(dt){
      for(let i = tracers.length-1; i >= 0; i--){
        const t = tracers[i];
        t.mesh.position.addScaledVector(t.dir, t.speed * dt);
        t.life -= dt;
        if(t.life <= 0){
          scene.remove(t.mesh);
          t.mesh.geometry.dispose();
          tracers.splice(i, 1);
        }
      }
    }

    // ── HIT DETECTION (lokal raycaster mot andra spelare) ───────────────────
    const localRaycaster = new THREE.Raycaster();

    function localShootRaycast(){
      // Skjut en ray från kameran rakt framåt
      localRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const targets = [...others.values()].map(o => o.sprite);
      const hits = localRaycaster.intersectObjects(targets);
      if(hits.length > 0){
        const hitSprite = hits[0].object;
        const hitOther = [...others.values()].find(o => o.sprite === hitSprite);
        if(hitOther) showToast(`TRÄFF på ${hitOther.last.name || "spelare"}!`);
      }
    }

    // =========================
    // Enfärgade material (snabbare)
    // =========================
    const wallMat  = new THREE.MeshLambertMaterial({ color: 0xcc8855 });
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x444440 });
    const ceilMat  = new THREE.MeshLambertMaterial({ color: 0x333338, side: THREE.BackSide });

    // =========================
    // Level (tilemap)
    // =========================
    const cellSize = 4;
    const MAP = [
      "########################",
      "#..........#...........#",
      "#..####....#....####...#",
      "#..#..#.........#..#...#",
      "#..####....##...####...#",
      "#...........#..........#",
      "#..####..#####..####...#",
      "#.....#..#...#..#......#",
      "###...#..#...#..#...####",
      "#.....#..#####..#......#",
      "#..........#...........#",
      "#..####....#....####...#",
      "#..#..#.........#..#...#",
      "#..####....#....####...#",
      "#..........#...........#",
      "########################"
    ];
    const mapH = MAP.length;
    const mapW = MAP[0].length;

    function isWallCell(cx, cz){
      if (cx < 0 || cz < 0 || cx >= mapW || cz >= mapH) return true;
      return MAP[cz][cx] === "#";
    }

    const floorGeo = new THREE.PlaneGeometry(mapW*cellSize, mapH*cellSize);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.set((mapW*cellSize)/2, 0, (mapH*cellSize)/2);
    scene.add(floor);

    const ceil = new THREE.Mesh(floorGeo, ceilMat);
    ceil.rotation.x = -Math.PI/2;
    ceil.position.set((mapW*cellSize)/2, 6, (mapH*cellSize)/2);
    scene.add(ceil);

    // InstancedMesh för väggar (snabbare än enskilda meshar)
    const wallCount = MAP.reduce((n,row)=>n+[...row].filter(c=>c==='#').length, 0);
    const wallGeo = new THREE.BoxGeometry(cellSize, 6, cellSize);
    const wallInst = new THREE.InstancedMesh(wallGeo, wallMat, wallCount);
    wallInst.receiveShadow = false;
    scene.add(wallInst);
    let wi = 0;
    const dummy = new THREE.Object3D();
    for (let z=0; z<mapH; z++){
      for (let x=0; x<mapW; x++){
        if (MAP[z][x] === "#"){
          dummy.position.set(x*cellSize + cellSize/2, 3, z*cellSize + cellSize/2);
          dummy.updateMatrix();
          wallInst.setMatrixAt(wi++, dummy.matrix);
        }
      }
    }
    wallInst.instanceMatrix.needsUpdate = true;

    // =========================
    // Other players
    // =========================
    const others = new Map();

    // =========================
    // Other players – 3D humanoid meshes
    // =========================
   
    // Delade material för alla spelare
    const pSkin   = new THREE.MeshLambertMaterial({ color: 0xe8b880 });
    const pShirt  = new THREE.MeshLambertMaterial({ color: 0x2255aa });
    const pPants  = new THREE.MeshLambertMaterial({ color: 0x223366 });
    const pShoe   = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const pHair   = new THREE.MeshLambertMaterial({ color: 0x2a1a08 });
    const pDead   = new THREE.MeshLambertMaterial({ color: 0x444444 });

    function makeHumanoid(){
      const g = new THREE.Group();

      const add = (geo, mat, x, y, z) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.userData.mat = mat; // spara för dödfärg-byte
        g.add(m);
        return m;
      };

      // Huvud
      add(new THREE.BoxGeometry(0.42, 0.46, 0.40), pSkin,  0,  1.68, 0);
      add(new THREE.BoxGeometry(0.44, 0.16, 0.42), pHair,  0,  1.87, 0);  // hår
      // Ögon
      add(new THREE.BoxGeometry(0.09, 0.07, 0.05), pShoe,  0.10, 1.70, 0.19);
      add(new THREE.BoxGeometry(0.09, 0.07, 0.05), pShoe, -0.10, 1.70, 0.19);

      // Kropp
      add(new THREE.BoxGeometry(0.60, 0.70, 0.32), pShirt, 0, 1.10, 0);

      // Armar
      add(new THREE.BoxGeometry(0.18, 0.60, 0.18), pShirt,  0.39, 1.10, 0);
      add(new THREE.BoxGeometry(0.18, 0.60, 0.18), pShirt, -0.39, 1.10, 0);
      add(new THREE.BoxGeometry(0.15, 0.28, 0.15), pSkin,   0.39, 0.65, 0); // handled/hand
      add(new THREE.BoxGeometry(0.15, 0.28, 0.15), pSkin,  -0.39, 0.65, 0);

      // Ben
      add(new THREE.BoxGeometry(0.22, 0.62, 0.22), pPants,  0.15, 0.44, 0);
      add(new THREE.BoxGeometry(0.22, 0.62, 0.22), pPants, -0.15, 0.44, 0);
      add(new THREE.BoxGeometry(0.22, 0.30, 0.22), pSkin,   0.15, 0.02, 0);
      add(new THREE.BoxGeometry(0.22, 0.30, 0.22), pSkin,  -0.15, 0.02, 0);

      // Skor
      add(new THREE.BoxGeometry(0.24, 0.12, 0.34), pShoe,  0.15, -0.16, 0.05);
      add(new THREE.BoxGeometry(0.24, 0.12, 0.34), pShoe, -0.15, -0.16, 0.05);

      return g;
    }

    function makeNameLabel(name){
      const c = document.createElement("canvas");
      c.width = 256; c.height = 48;
      const g = c.getContext("2d");
      g.clearRect(0,0,256,48);
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.roundRect(4, 4, 248, 40, 8);
      g.fill();
      g.font = "bold 22px Arial, sans-serif";
      g.fillStyle = "#fff";
      g.textAlign = "center";
      g.fillText(name, 128, 30);
      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    function ensureOther(id, name){
      if (others.has(id)) return others.get(id);

      const humanoid = makeHumanoid();
      scene.add(humanoid);

      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeNameLabel(name), transparent: true, depthTest: false }));
      label.scale.set(2.2, 0.55, 1);
      scene.add(label);

      // Muzzle flash för motståndare
      const enemyFlashLight = new THREE.PointLight(0xff8800, 0, 5);
      humanoid.add(enemyFlashLight);
      enemyFlashLight.position.set(0.42, 1.10, -0.5); // ungefär vid hand/vapnet

      const o = {
        humanoid,
        label,
        flashLight: enemyFlashLight,
        flashLife: 0,
        last: { x:0, z:0, yaw:0, pitch:0, hp:100, name },
        render: { x:0, z:0 }
      };
      others.set(id, o);
      return o;
    }

    function removeOther(id){
      const o = others.get(id);
      if (!o) return;
      scene.remove(o.humanoid);
      scene.remove(o.label);
      others.delete(id);
    }

    // =========================
    // Player movement: Doom-ish “slide”
    // =========================
    const keys = new Set();
    addEventListener("keydown", e => keys.add(e.code));
    addEventListener("keyup", e => keys.delete(e.code));

    // Tweakables (more classic Doom feel)
    const MOVE_SPEED = 10.4;    // higher top speed
    const ACCEL_GROUND = 30.0;  // snappier acceleration
    const FRICTION = 10.0;      // lower friction => more sliding
    const STRAFE_BIAS = 1.0;    // keep strafe same speed

    const player = {
      id: null,
      pos: new THREE.Vector3(cellSize*2, 1.7, cellSize*2),
      vel: new THREE.Vector3(),
      radius: 0.55,
      hp: 100,
      ammo: 50,
      room: "lobby"
    };
    controls.getObject().position.copy(player.pos);

    function circleHitsWall(x, z, r){
      const minCX = Math.floor((x - r) / cellSize);
      const maxCX = Math.floor((x + r) / cellSize);
      const minCZ = Math.floor((z - r) / cellSize);
      const maxCZ = Math.floor((z + r) / cellSize);

      for (let cz=minCZ; cz<=maxCZ; cz++){
        for (let cx=minCX; cx<=maxCX; cx++){
          if (!isWallCell(cx,cz)) continue;
          const x0 = cx*cellSize, x1 = x0 + cellSize;
          const z0 = cz*cellSize, z1 = z0 + cellSize;
          const px = Math.max(x0, Math.min(x, x1));
          const pz = Math.max(z0, Math.min(z, z1));
          const dx = x - px, dz = z - pz;
          if (dx*dx + dz*dz < r*r) return true;
        }
      }
      return false;
    }

    function collideAndSlide(newPos){
      const r = player.radius;

      const tryX = new THREE.Vector3(newPos.x, newPos.y, player.pos.z);
      if (!circleHitsWall(tryX.x, tryX.z, r)) player.pos.x = tryX.x;

      const tryZ = new THREE.Vector3(player.pos.x, newPos.y, newPos.z);
      if (!circleHitsWall(tryZ.x, tryZ.z, r)) player.pos.z = tryZ.z;
    }

    // Doom-ish: accelerate towards wish direction (instead of simple lerp)
    function accelerate(vx, vz, wishX, wishZ, wishSpeed, accel, dt){
      const currentSpeed = vx*wishX + vz*wishZ; // dot(v, wishDir)
      const addSpeed = wishSpeed - currentSpeed;
      if (addSpeed <= 0) return { vx, vz };

      let accelSpeed = accel * dt * wishSpeed;
      if (accelSpeed > addSpeed) accelSpeed = addSpeed;

      return { vx: vx + accelSpeed*wishX, vz: vz + accelSpeed*wishZ };
    }

    function applyFriction(vx, vz, friction, dt){
      const speed = Math.hypot(vx, vz);
      if (speed < 1e-6) return { vx:0, vz:0 };

      const drop = speed * friction * dt;
      const newSpeed = Math.max(0, speed - drop);
      const scale = newSpeed / speed;
      return { vx: vx*scale, vz: vz*scale };
    }

    function movePlayer(dt){
      // Camera forward (XZ)
      const forward = new THREE.Vector3();
      controls.getDirection(forward);
      forward.y = 0; forward.normalize();

      // Right vector for strafing
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

      // W=framåt, S=bakåt, A=strafe vänster, D=strafe höger
      let f = 0, s = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp"))    f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown"))  f -= 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft"))  s -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) s += 1;

      // wish direction in world space
      const wish = new THREE.Vector3()
        .addScaledVector(forward, f)
        .addScaledVector(right, s * STRAFE_BIAS);

      let wishSpeed = MOVE_SPEED;
      if (wish.lengthSq() > 0) {
        wish.normalize();
      } else {
        wishSpeed = 0;
      }

      // friction then acceleration (classic-ish)
      const fr = applyFriction(player.vel.x, player.vel.z, FRICTION, dt);
      player.vel.x = fr.vx; player.vel.z = fr.vz;

      if (wishSpeed > 0) {
        const acc = accelerate(player.vel.x, player.vel.z, wish.x, wish.z, wishSpeed, ACCEL_GROUND, dt);
        player.vel.x = acc.vx; player.vel.z = acc.vz;
      }

      // integrate + collide
      const newPos = player.pos.clone().addScaledVector(player.vel, dt);
      newPos.y = 1.7;
      collideAndSlide(newPos);

      controls.getObject().position.copy(player.pos);

      // 3D weapon bob – uppdatera bara position på weaponGroup (som är barn till camera)
      const speedNow = Math.hypot(player.vel.x, player.vel.z);
      weaponBobT += speedNow * 0.004;
      const bobY = Math.sin(weaponBobT * 6) * Math.min(speedNow, 10) * 0.003;
      const bobX = Math.sin(weaponBobT * 3) * Math.min(speedNow, 10) * 0.001;
      weaponKick = Math.max(0, weaponKick - 0.005);
      const wp = new THREE.Vector3(0.22 + bobX, -0.20 + bobY + weaponKick, -0.30);
      weaponGroup.position.copy(wp);
      // Synka kopian i weaponScene
      weaponGroupCopy.position.copy(wp);
      weaponGroupCopy.rotation.copy(weaponGroup.rotation);
    }

    // =========================
    // Networking
    // =========================
    let ws = null;

    function wsSend(obj){
      if (!ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify(obj));
    }

    function connectAndJoin(){
      const name = document.getElementById("name").value || "player";
      const room = document.getElementById("room").value || "lobby";
      player.room = room;

      statusEl.textContent = `Ansluter till ${WS_URL} ...`;
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connected = true;
        statusEl.textContent = "Ansluten. Laddar rum...";
        wsSend({ t:"join", name, room });
      };

      ws.onclose = () => {
        connected = false;
        statusEl.textContent = "Frånkopplad.";
        player.id = null;
        for (const id of [...others.keys()]) removeOther(id);
        ui.style.display = "flex";
      };

      ws.onerror = () => {
        statusEl.textContent = "Fel vid anslutning (kolla Render logs).";
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.t === "welcome") {
          player.id = msg.id;
          player.hp = msg.you.hp;
          player.pos.x = msg.you.x; player.pos.z = msg.you.z;
          controls.getObject().position.copy(player.pos);

          for (const p of msg.players) {
            if (p.id === player.id) continue;
            const o = ensureOther(p.id, p.name);
            o.last = { ...p };
            o.render.x = p.x; o.render.z = p.z;
          }

          showToast(`Joined: ${msg.room}`);
          ui.style.display = "none";
          setTimeout(() => controls.lock(), 50);
          return;
        }

        if (msg.t === "player_join") {
          if (msg.p.id === player.id) return;
          const o = ensureOther(msg.p.id, msg.p.name);
          o.last = { ...msg.p };
          o.render.x = msg.p.x; o.render.z = msg.p.z;
          showToast(`${msg.p.name} joined`);
          return;
        }

        if (msg.t === "player_leave") {
          removeOther(msg.id);
          return;
        }

        if (msg.t === "player_name") {
          const o = ensureOther(msg.id, msg.name);
          o.label.material.map = makeNameLabel(msg.name);
          o.label.material.needsUpdate = true;
          o.last.name = msg.name;
          return;
        }

        if (msg.t === "hit") {
          if (msg.to === player.id) {
            player.hp = msg.hp;
            triggerHitFlash();
            showToast("TRÄFFAD!");
          }
          if (msg.from === player.id) showToast("TRÄFF!");
          // Visa muzzle flash på motståndaren som sköt
          const shooter = others.get(msg.from);
          if (shooter) {
            shooter.flashLife = 1.0;
            shooter.flashLight.intensity = 5;
          }
          const o = others.get(msg.to);
          if (o) o.last.hp = msg.hp;
          return;
        }

        if (msg.t === "respawn") {
          if (msg.id === player.id) {
            player.hp = msg.hp;
            player.pos.x = msg.x; player.pos.z = msg.z;
            player.vel.set(0,0,0);
            controls.getObject().position.copy(player.pos);
            showToast("RESPAWN");
          } else {
            const o = ensureOther(msg.id, (others.get(msg.id)?.last?.name) || "player");
            o.last.x = msg.x; o.last.z = msg.z; o.last.hp = msg.hp;
            o.render.x = msg.x; o.render.z = msg.z;
          }
          return;
        }

        if (msg.t === "state") {
          for (const p of msg.players) {
            if (p.id === player.id) {
              player.hp = p.hp;
              continue;
            }
            const o = ensureOther(p.id, p.name);
            o.last = { ...p };
          }
        }
      };
    }

    document.getElementById("join").addEventListener("click", () => {
      // Starta alltid lokalt (offline-läge om ingen server)
      player.room = document.getElementById("room").value || "lobby";
      player.hp = 100;
      player.ammo = 50;
      player.pos.set(cellSize*2, 1.7, cellSize*2);
      controls.getObject().position.copy(player.pos);
      ui.style.display = "none";
      updateHUD();
      setTimeout(() => controls.lock(), 50);
      // Försök också ansluta till server
      connectAndJoin();
    });

    // =========================
    // Input sending (world-space)
    // =========================
    function getYawPitch(){
      const yaw = controls.getObject().rotation.y;
      const pitch = camera.rotation.x;
      return { yaw, pitch };
    }

    function computeWorldInput(){
      const forward = new THREE.Vector3();
      controls.getDirection(forward);
      forward.y = 0; forward.normalize();

      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

      let f = 0, s = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp"))    f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown"))  f -= 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft"))  s -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) s += 1;

      const v = new THREE.Vector3()
        .addScaledVector(forward, f)
        .addScaledVector(right, s);

      if (v.lengthSq() > 0) v.normalize();
      return { ix: v.x, iz: v.z };
    }

    // shooting
    let shootCooldown = 0;
    addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (!connected || !controls.isLocked) return;
      if (shootCooldown > 0) return;
      if (player.ammo <= 0) { showToast("TOMT! (R = ladda om)"); return; }

      player.ammo--;
      shootCooldown = 0.12;
      triggerMuzzleFlash();

      // Spawn tracer från kameran framåt
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const from = camera.position.clone().addScaledVector(dir, 0.5);
      spawnTracer(from, dir);

      // Lokal hit-check (visuell feedback direkt)
      localShootRaycast();

      // Skicka till server
      const { yaw, pitch } = getYawPitch();
      wsSend({ t:"shoot", yaw, pitch });
    });

    // Reload with R
    addEventListener("keydown", e => {
      if (e.code === "KeyR" && controls.isLocked) {
        player.ammo = 50;
        showToast("LADDAT!");
        updateHUD();
      }
    });

    let inputSendAccum = 0;

    // =========================
    // Loop
    // =========================
    const clock = new THREE.Clock();

    function updateOthers(dt){
      const interp = 1 - Math.exp(-18 * dt);
      for (const [id, o] of others) {
        const tx = o.last.x, tz = o.last.z;
        o.render.x += (tx - o.render.x) * interp;
        o.render.z += (tz - o.render.z) * interp;

        // y=0 = golvet, figuren är ~1.9 hög, sätt origin vid fötterna
        o.humanoid.position.set(o.render.x, 0, o.render.z);

        // Vänd figuren mot kameran (yaw från servern om tillgänglig)
        if (o.last.yaw !== undefined) {
          o.humanoid.rotation.y = o.last.yaw + Math.PI;
        }

        // Namnlapp ovanför huvud
        o.label.position.set(o.render.x, 2.4, o.render.z);

        // Dödfärg
        const hp = o.last.hp ?? 100;
        const alive = hp > 0;
        o.humanoid.traverse(m => {
          if (m.isMesh) m.material = alive ? m.userData.mat : pDead;
        });

        // Animera motståndarens muzzle flash
        if (o.flashLife > 0) {
          o.flashLife = Math.max(0, o.flashLife - dt * 18);
          o.flashLight.intensity = o.flashLife * 5;
        }
      }
    }

    // Hit flash
    const hitflash = document.getElementById("hitflash");
    function triggerHitFlash(){
      hitflash.style.background = "rgba(220,0,0,0.35)";
      setTimeout(()=> hitflash.style.background = "rgba(220,0,0,0)", 150);
    }

    // Muzzle flash on weapon
    function triggerMuzzleFlash(){
      weaponKick = 0.04;
      muzzleFlashLife = 1.0;
      muzzleLight.intensity = 6;
      muzzleSpriteMat.opacity = 1;
      // Liten vit screen-flash
      hitflash.style.background = "rgba(255,210,100,0.06)";
      setTimeout(()=> hitflash.style.background = "", 55);
    }

    const hudHp      = document.getElementById("hud-hp");
    const hudAmmo    = document.getElementById("hud-ammo");
    const hudFace    = document.getElementById("hud-face");
    const hudPlayers = document.getElementById("hud-players");
    const hudRoom    = document.getElementById("hud-room");

    function updateHUD(){
      const hp = Math.max(0, player.hp);
      hudHp.textContent   = hp;
      hudAmmo.textContent = player.ammo;
      hudPlayers.textContent = others.size + 1;
      hudRoom.textContent = connected ? `RUM: ${player.room}` : "OFFLINE";

      // Face
      if      (hp > 70) hudFace.textContent = "😐";
      else if (hp > 40) hudFace.textContent = "😬";
      else if (hp > 15) hudFace.textContent = "😰";
      else              hudFace.textContent = "😵";

      // HP color
      hudHp.style.color = hp > 50 ? "#ff4400" : hp > 25 ? "#ffaa00" : "#ff0000";
    }

    function handleResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (weaponCamera) {
        weaponCamera.aspect = camera.aspect;
        weaponCamera.updateProjectionMatrix();
      }
    }
    addEventListener("resize", handleResize);

    let perfTime = 0;

    function tick(){
      const dt = Math.min(0.033, clock.getDelta());
      perfTime += dt * 1000;

      if (shootCooldown > 0) shootCooldown -= dt;

      if (controls.isLocked){
        movePlayer(dt);
      }

      if (connected) {
        inputSendAccum += dt;
        if (inputSendAccum >= 1/30) {
          inputSendAccum = 0;
          const { yaw, pitch } = getYawPitch();
          const inp = computeWorldInput();
          wsSend({ t:"input", ix: inp.ix, iz: inp.iz, yaw, pitch });
        }
      }

      updateOthers(dt);
      updateTracers(dt);
      updateHUD();

      // Animera muzzle flash
      if (muzzleFlashLife > 0) {
        muzzleFlashLife = Math.max(0, muzzleFlashLife - dt * 18);
        muzzleLight.intensity = muzzleFlashLife * 6;
        muzzleSpriteMat.opacity = muzzleFlashLife;
        const s = 0.1 + muzzleFlashLife * 0.22;
        muzzleSprite.scale.set(s, s, 1);
      }

      // Synka inga kameror – vapnet följer automatiskt som barn till camera

      // Enkel render – vapnet ingår i scenen via camera.add()
      renderer.render(scene, camera);

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
