<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doom-ish PvP (Server-authoritative)</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
    #ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font:16px system-ui; color:#fff; background: rgba(0,0,0,.55); z-index:10; user-select:none; }
    #ui .box { max-width:780px; padding:18px 20px; border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.35); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
    #ui .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    #ui input { width:220px; padding:9px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.35); color:#fff; outline:none; }
    #ui button { padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.14); color:#fff; cursor:pointer; }
    #hud { position:fixed; left:12px; top:10px; color:#fff; font:14px ui-monospace, monospace;
      text-shadow:0 2px 0 #000; white-space:pre; z-index:5; pointer-events:none; }
    #crosshair { position:fixed; left:50%; top:50%; width:10px; height:10px; transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.85); border-left:none; border-top:none; rotate:45deg; z-index:5; pointer-events:none; }
    #toast { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); color:#fff;
      background: rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15); padding:8px 10px; border-radius:12px;
      font:13px system-ui; opacity:0; transition: opacity .2s ease; pointer-events:none; z-index:6; }
    #weapon { position:fixed; left:50%; bottom:-6px; transform:translateX(-50%);
      width:min(520px,70vw); opacity:.96; image-rendering:pixelated; pointer-events:none;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,.55)); z-index:4; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="ui">
    <div class="box">
      <h1 style="margin:0 0 10px; font-size:20px;">Doom-ish PvP</h1>
      <p class="row" style="margin:8px 0; opacity:.92; line-height:1.5;">
        <span>Namn:</span><input id="name" maxlength="16" value="tobbe" />
        <span>Rum:</span><input id="room" maxlength="16" value="lobby" />
        <button id="join">Join</button>
      </p>
      <p style="margin:8px 0; opacity:.92; line-height:1.5;"><b>WASD</b> = gå/strafa • <b>Mus</b> = titta • <b>Klick</b> = skjut • <b>ESC</b> = meny</p>
      <p style="margin:8px 0; opacity:.78; line-height:1.5;">Servern styr positioner (träffar blir korrekta). HP=100. Skott=-25. Respawn vid död.</p>
      <p id="status" style="margin:8px 0; opacity:.9;"></p>
    </div>
  </div>
  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <img id="weapon" alt="weapon" />
<script type="module">
import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
const MAX_HP = 100;
const DMG_PER_SHOT = 25;

const INTERNAL_W = 426, INTERNAL_H = 240;
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:"high-performance" });
renderer.setPixelRatio(1);
renderer.setSize(INTERNAL_W, INTERNAL_H, false);
renderer.domElement.style.width = "100vw";
renderer.domElement.style.height = "100vh";
renderer.domElement.style.imageRendering = "pixelated";
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x14121a, 18, 120);

const camera = new THREE.PerspectiveCamera(75, INTERNAL_W/INTERNAL_H, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(6,12,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(-6,8,-4); scene.add(fill);

const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());

const ui = document.getElementById("ui");
const statusEl = document.getElementById("status");
const hud = document.getElementById("hud");
const toast = document.getElementById("toast");
const weaponImg = document.getElementById("weapon");

function showToast(text){
  toast.textContent = text;
  toast.style.opacity = "1";
  setTimeout(()=> toast.style.opacity = "0", 900);
}

controls.addEventListener("lock", () => ui.style.display = "none");
controls.addEventListener("unlock", () => ui.style.display = "flex");

ui.addEventListener("click", (e)=>{
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
  if (connected) controls.lock();
});

// weapon sprite
weaponImg.src = (() => {
  const c = document.createElement("canvas"); c.width=240; c.height=140;
  const g = c.getContext("2d"); g.imageSmoothingEnabled=false;
  const px=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); };
  px(40,70,160,50,"#2b2b2f"); px(55,55,120,20,"#3a3a40"); px(70,45,90,15,"#4a4a52");
  px(150,62,55,10,"#1f1f22"); px(190,60,30,14,"#131316"); px(55,58,120,3,"#5a5a62");
  px(95,95,55,40,"#2a1b18"); px(100,100,45,30,"#3a221d"); px(105,105,35,20,"#5a2a20");
  return c.toDataURL();
})();

function nearest(tex){
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestMipMapNearestFilter;
  tex.generateMipmaps = true;
  return tex;
}
function makeCanvasTexture(w,h,drawFn){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d"); drawFn(g,w,h);
  const tex=new THREE.CanvasTexture(c); return nearest(tex);
}

const texBrick = makeCanvasTexture(64,64,(g,w,h)=>{
  g.fillStyle="#2a1b18"; g.fillRect(0,0,w,h);
  const mortar="#140c0b", b1="#6a2a1f", b2="#7a3024", b3="#5e241b";
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const bx=x*8+(y%2?4:0), by=y*8;
    const col=[b1,b2,b3][(x+y)%3];
    g.fillStyle=col; g.fillRect(bx,by,7,7);
    g.fillStyle=mortar; g.fillRect(bx+7,by,1,8); g.fillRect(bx,by+7,8,1);
  }
  g.globalAlpha=0.22;
  for(let i=0;i<90;i++){ g.fillStyle=i%2?"#000":"#1b0f0d"; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,2,1); }
  g.globalAlpha=1;
});
const texFloor = makeCanvasTexture(64,64,(g,w,h)=>{
  g.fillStyle="#1a181b"; g.fillRect(0,0,w,h);
  for(let i=0;i<2200;i++){ const v=28+(Math.random()*75)|0; g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,1,1); }
});
const texCeil = makeCanvasTexture(64,64,(g,w,h)=>{
  g.fillStyle="#15141a"; g.fillRect(0,0,w,h);
  g.strokeStyle="rgba(255,255,255,0.06)";
  for(let i=0;i<=8;i++){ g.beginPath(); g.moveTo(i*8,0); g.lineTo(i*8,h); g.stroke(); g.beginPath(); g.moveTo(0,i*8); g.lineTo(w,i*8); g.stroke(); }
});

const cellSize=4;
const MAP=[
"########################",
"#..........#...........#",
"#..####....#....####...#",
"#..#..#.........#..#...#",
"#..####....##...####...#",
"#...........#..........#",
"#..####..#####..####...#",
"#.....#..#...#..#......#",
"###...#..#...#..#...####",
"#.....#..#####..#......#",
"#..........#...........#",
"#..####....#....####...#",
"#..#..#.........#..#...#",
"#..####....#....####...#",
"#..........#...........#",
"########################"
];
const mapH=MAP.length, mapW=MAP[0].length;

const floorGeo=new THREE.PlaneGeometry(mapW*cellSize,mapH*cellSize);
const floorMat=new THREE.MeshLambertMaterial({map:texFloor}); floorMat.map.repeat.set(mapW*0.75,mapH*0.75);
const floor=new THREE.Mesh(floorGeo,floorMat); floor.rotation.x=-Math.PI/2; floor.position.set((mapW*cellSize)/2,0,(mapH*cellSize)/2); scene.add(floor);
const ceilMat=new THREE.MeshLambertMaterial({map:texCeil,side:THREE.BackSide}); ceilMat.map.repeat.set(mapW*0.9,mapH*0.9);
const ceil=new THREE.Mesh(floorGeo,ceilMat); ceil.rotation.x=-Math.PI/2; ceil.position.set((mapW*cellSize)/2,6,(mapH*cellSize)/2); scene.add(ceil);
const wallGeo=new THREE.BoxGeometry(cellSize,6,cellSize);
const wallMat=new THREE.MeshLambertMaterial({map:texBrick});
for(let z=0;z<mapH;z++)for(let x=0;x<mapW;x++) if(MAP[z][x]==="#"){
  const w=new THREE.Mesh(wallGeo,wallMat); w.position.set(x*cellSize+cellSize/2,3,z*cellSize+cellSize/2); scene.add(w);
}

// other players sprite
function makePlayerSpriteTexture(){
  const c=document.createElement("canvas"); c.width=64;c.height=64;
  const g=c.getContext("2d"); const px=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  px(18,10,28,44,"#2b6a7a"); px(22,18,20,18,"#5aa6b5"); px(24,22,6,6,"#ffccaa"); px(34,22,6,6,"#ffccaa"); px(22,40,20,8,"#1a1a1c");
  const tex=new THREE.CanvasTexture(c); return nearest(tex);
}
const playerTex=makePlayerSpriteTexture();
const others=new Map();
function makeNameLabel(name){
  const c=document.createElement("canvas"); c.width=256;c.height=64;
  const g=c.getContext("2d"); g.fillStyle="rgba(0,0,0,0.35)"; g.fillRect(0,8,256,40);
  g.font="22px ui-monospace, monospace"; g.fillStyle="#fff"; g.textAlign="center"; g.fillText(name,128,36);
  const tex=new THREE.CanvasTexture(c); tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter; return tex;
}
function ensureOther(id,name){
  if(others.has(id)) return others.get(id);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:playerTex})); sprite.scale.set(2.1,2.1,1); scene.add(sprite);
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:makeNameLabel(name),transparent:true})); label.scale.set(3.2,0.8,1); scene.add(label);
  const o={sprite,label,last:{x:0,z:0,yaw:0,pitch:0,hp:MAX_HP,name},render:{x:0,z:0}};
  others.set(id,o); return o;
}
function removeOther(id){ const o=others.get(id); if(!o) return; scene.remove(o.sprite); scene.remove(o.label); others.delete(id); }

// player state (server authoritative)
const player={ id:null, hp:MAX_HP, room:"lobby", serverX:8, serverZ:8, camX:8, camZ:8 };
controls.getObject().position.set(player.camX,1.7,player.camZ);

const keys=new Set();
addEventListener("keydown", e=>keys.add(e.code));
addEventListener("keyup", e=>keys.delete(e.code));

function getYawPitch(){
  return { yaw: controls.getObject().rotation.y, pitch: camera.rotation.x };
}

function computeWorldInput(){
  const forward=new THREE.Vector3(); controls.getDirection(forward); forward.y=0; forward.normalize();
  // ✅ right = forward x up
  const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

  let f=0,s=0;
  if(keys.has("KeyW")) f+=1;
  if(keys.has("KeyS")) f-=1;
  if(keys.has("KeyA")) s-=1;
  if(keys.has("KeyD")) s+=1;

  const v=new THREE.Vector3().addScaledVector(forward,f).addScaledVector(right,s);
  if(v.lengthSq()>0) v.normalize();
  return { ix:v.x, iz:v.z };
}

// networking
let ws=null, connected=false;

function wsSend(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

function connectAndJoin(){
  const name=(document.getElementById("name").value||"player");
  const room=(document.getElementById("room").value||"lobby");
  player.room=room;

  statusEl.textContent=`Ansluter till ${WS_URL} ...`;
  ws=new WebSocket(WS_URL);

  ws.onopen=()=>{ connected=true; statusEl.textContent="Ansluten. Laddar rum..."; wsSend({t:"join",name,room}); };
  ws.onclose=()=>{ connected=false; statusEl.textContent="Frånkopplad."; player.id=null; for(const id of [...others.keys()]) removeOther(id); ui.style.display="flex"; };
  ws.onerror=()=>{ statusEl.textContent="Fel vid anslutning (kolla Render logs)."; };

  ws.onmessage=(ev)=>{
    let msg; try{ msg=JSON.parse(ev.data);}catch{return;}

    if(msg.t==="welcome"){
      player.id=msg.id; player.hp=msg.you.hp;
      player.serverX=msg.you.x; player.serverZ=msg.you.z;
      player.camX=player.serverX; player.camZ=player.serverZ;
      controls.getObject().position.set(player.camX,1.7,player.camZ);

      for(const p of msg.players){
        if(p.id===player.id) continue;
        const o=ensureOther(p.id,p.name); o.last={...p}; o.render.x=p.x; o.render.z=p.z;
      }
      showToast(`Joined: ${msg.room}`);
      ui.style.display="none";
      setTimeout(()=>controls.lock(),50);
      return;
    }

    if(msg.t==="player_join"){
      if(msg.p.id===player.id) return;
      const o=ensureOther(msg.p.id,msg.p.name); o.last={...msg.p}; o.render.x=msg.p.x; o.render.z=msg.p.z;
      return;
    }

    if(msg.t==="player_leave"){ removeOther(msg.id); return; }

    if(msg.t==="player_name"){
      const o=ensureOther(msg.id,msg.name);
      o.label.material.map=makeNameLabel(msg.name); o.label.material.needsUpdate=true;
      o.last.name=msg.name; return;
    }

    if(msg.t==="hit"){
      if(msg.to===player.id){ player.hp=msg.hp; showToast(`TRÄFFAD! -${DMG_PER_SHOT}`); }
      const o=others.get(msg.to); if(o) o.last.hp=msg.hp;
      return;
    }

    if(msg.t==="respawn"){
      if(msg.id===player.id){
        player.hp=msg.hp;
        player.serverX=msg.x; player.serverZ=msg.z;
        player.camX=player.serverX; player.camZ=player.serverZ;
        controls.getObject().position.set(player.camX,1.7,player.camZ);
        showToast("RESPAWN");
      } else {
        const o=ensureOther(msg.id,(others.get(msg.id)?.last?.name)||"player");
        o.last.x=msg.x; o.last.z=msg.z; o.last.hp=msg.hp; o.render.x=msg.x; o.render.z=msg.z;
      }
      return;
    }

    if(msg.t==="state"){
      for(const p of msg.players){
        if(p.id===player.id){
          player.hp=p.hp;
          player.serverX=p.x; player.serverZ=p.z;
          continue;
        }
        const o=ensureOther(p.id,p.name);
        o.last={...p};
      }
    }
  };
}

document.getElementById("join").addEventListener("click", ()=>connectAndJoin());

// shoot
let shootCooldown=0;
addEventListener("mousedown", ()=>{
  if(!connected || !controls.isLocked) return;
  if(shootCooldown>0) return;
  shootCooldown=0.12;
  weaponImg.style.filter="drop-shadow(0 6px 0 rgba(0,0,0,.55)) brightness(1.25)";
  setTimeout(()=> weaponImg.style.filter="drop-shadow(0 6px 0 rgba(0,0,0,.55))", 60);
  const {yaw,pitch}=getYawPitch();
  wsSend({t:"shoot",yaw,pitch});
});

let inputSendAccum=0;
const clock=new THREE.Clock();
let perfTime=0;

function updateOthers(dt){
  const interp=1 - Math.exp(-18*dt);
  for(const [id,o] of others){
    const tx=o.last.x, tz=o.last.z;
    o.render.x += (tx - o.render.x) * interp;
    o.render.z += (tz - o.render.z) * interp;
    o.sprite.position.set(o.render.x,1.7,o.render.z);
    o.label.position.set(o.render.x,3.3,o.render.z);
    const hp=o.last.hp ?? MAX_HP;
    o.sprite.material.color.setScalar(hp<=0 ? 0.25 : 0.95);
  }
}

function updateSelf(dt){
  // Smooth camera towards server position to avoid jitter
  const t = 1 - Math.exp(-22*dt);
  player.camX += (player.serverX - player.camX) * t;
  player.camZ += (player.serverZ - player.camZ) * t;
  controls.getObject().position.set(player.camX, 1.7, player.camZ);

  // weapon bob based on movement (server delta)
  const dx = player.serverX - player.camX;
  const dz = player.serverZ - player.camZ;
  const speedApprox = Math.hypot(dx, dz) / Math.max(1e-3, dt);
  const bob = Math.sin(perfTime*0.012 + speedApprox*0.03) * Math.min(10, speedApprox) * 0.02;
  weaponImg.style.transform = `translateX(-50%) translateY(${bob}px)`;
}

function updateHUD(){
  hud.textContent =
    `ROOM ${player.room}\n` +
    `HP   ${String(Math.max(0,player.hp)).padStart(3," ")}\n` +
    `DMG  ${DMG_PER_SHOT}\n` +
    `WS   ${connected ? "ON" : "OFF"}\n` +
    `ESC  MENU`;
}

function handleResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(INTERNAL_W, INTERNAL_H, false);
  renderer.domElement.style.width="100vw";
  renderer.domElement.style.height="100vh";
}
addEventListener("resize", handleResize);

function tick(){
  const dt=Math.min(0.033, clock.getDelta());
  perfTime += dt*1000;
  if(shootCooldown>0) shootCooldown -= dt;

  if(connected){
    inputSendAccum += dt;
    if(inputSendAccum >= 1/30){
      inputSendAccum = 0;
      const {yaw,pitch}=getYawPitch();
      const inp=computeWorldInput();
      wsSend({t:"input", ix: inp.ix, iz: inp.iz, yaw, pitch});
    }
  }

  updateSelf(dt);
  updateOthers(dt);
  updateHUD();

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
