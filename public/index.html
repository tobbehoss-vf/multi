<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a15; color: #fff; overflow: hidden; height: 100vh; }
        #mainContainer { display: flex; height: 100vh; }
        #lobbyScreen { display: flex; width: 100%; padding: 40px; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%); }
        #lobby { text-align: center; }
        .lobby-header h1 { font-size: 3em; color: #00ff88; margin-bottom: 30px; }
        .lobby-content { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1000px; }
        .section { background: rgba(0, 0, 0, 0.3); border: 2px solid #00ff88; padding: 20px; border-radius: 8px; }
        .section h2 { color: #00ff88; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; color: #00ffff; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: rgba(0, 255, 255, 0.1); border: 1px solid #0064ff; color: #fff; border-radius: 4px; font-family: 'Courier New', monospace; }
        button { background: linear-gradient(135deg, #00ff88 0%, #00ffff 100%); color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; }
        button:hover { transform: scale(1.05); }
        #gameContainer { display: none; flex: 1; flex-direction: column; width: 100%; height: 100vh; }
        .game-header { background: rgba(0, 0, 0, 0.5); padding: 15px; border-bottom: 2px solid #00ff88; display: flex; justify-content: space-between; flex-shrink: 0; }
        .scores { display: flex; gap: 20px; }
        .score-item { padding: 8px 15px; border: 2px solid; border-radius: 4px; font-weight: bold; }
        .score-blue { border-color: #0099ff; color: #0099ff; }
        .score-red { border-color: #ff3333; color: #ff3333; }
        .score-yellow { border-color: #ffff00; color: #ffff00; }
        .score-green { border-color: #00ff88; color: #00ff88; }
        .game-content { display: flex; flex: 1; gap: 15px; padding: 15px; min-height: 0; }
        #gameCanvas { flex: 1; background: #0a0a1a; border: 2px solid #00ff88; border-radius: 4px; cursor: crosshair; width: 100%; height: 100%; }
        .sidebar { width: 220px; background: rgba(0, 0, 0, 0.5); border: 2px solid #00ff88; border-radius: 4px; padding: 12px; overflow-y: auto; font-size: 0.9em; flex-shrink: 0; }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-section h3 { color: #00ff88; margin-bottom: 10px; border-bottom: 1px solid #00ff88; padding-bottom: 5px; }
        .player-stat { margin-bottom: 8px; color: #00ffff; }
        .hp-bar { width: 100%; height: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid #ff3333; border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .hp-fill { height: 100%; background: #00ff88; transition: width 0.1s; }
        .ammo-bar { width: 100%; height: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid #00ffff; border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .ammo-fill { height: 100%; background: #00ff88; transition: width 0.1s; }
        .scoreboard { font-size: 0.8em; }
        .scoreboard-entry { background: rgba(0, 255, 136, 0.05); padding: 5px; margin-bottom: 5px; border-left: 2px solid #00ffff; border-radius: 2px; }
        .scoreboard-entry .name { color: #00ffff; font-weight: bold; }
        .scoreboard-entry .stats { color: #00ff88; font-size: 0.85em; }
        .controls { background: rgba(0, 0, 0, 0.3); padding: 10px; border: 1px solid #00ff88; border-radius: 4px; font-size: 0.8em; line-height: 1.6; }
        .controls strong { color: #00ff88; }
        #gameList { max-height: 300px; overflow-y: auto; }
        .game-item { background: rgba(0, 255, 136, 0.05); border-left: 3px solid #00ffff; padding: 10px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; }
        .game-item:hover { background: rgba(0, 255, 136, 0.15); }
    </style>
</head>
<body>
    <div id="mainContainer">
        <div id="lobbyScreen">
            <div id="lobby">
                <div class="lobby-header">
                    <h1>⚔ TANK BATTLE ⚔</h1>
                </div>
                <div class="lobby-content">
                    <div class="section">
                        <h2>Tillgängliga spel</h2>
                        <div id="gameList"></div>
                        <button onclick="createGame()" style="width: 100%; margin-top: 15px;">Skapa nytt spel</button>
                    </div>
                    <div class="section">
                        <h2>Gå med i spel</h2>
                        <div class="form-group">
                            <label>Spelarnamn</label>
                            <input type="text" id="playerName" value="Player">
                        </div>
                        <div class="form-group">
                            <label>Tank</label>
                            <select id="tankType">
                                <option>Classic</option>
                                <option>Heavy</option>
                                <option>Scout</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Lag</label>
                            <select id="teamIndex">
                                <option value="0">Blå</option>
                                <option value="1">Röd</option>
                                <option value="2">Gul</option>
                                <option value="3">Grön</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Spel</label>
                            <select id="selectedGame"></select>
                        </div>
                        <button onclick="joinGame()" style="width: 100%;">Gå med</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameContainer">
            <div class="game-header">
                <div class="scores">
                    <div class="score-item score-blue">BLÅ: <span id="scoreBlue">0</span></div>
                    <div class="score-item score-red">RÖD: <span id="scoreRed">0</span></div>
                    <div class="score-item score-yellow">GUL: <span id="scoreYellow">0</span></div>
                    <div class="score-item score-green">GRÖN: <span id="scoreGreen">0</span></div>
                </div>
                <button onclick="leaveGame()">Lämna</button>
            </div>
            <div class="game-content">
                <canvas id="gameCanvas"></canvas>
                <div class="sidebar">
                    <div class="sidebar-section">
                        <h3>Din tank</h3>
                        <div class="player-stat">HP: <span id="playerHealth">100</span>/100</div>
                        <div class="hp-bar"><div class="hp-fill" id="hpBar" style="width: 100%;"></div></div>
                        <div class="player-stat" style="margin-top: 10px;">Ammo: <span id="playerAmmo">10</span>/10</div>
                        <div class="ammo-bar"><div class="ammo-fill" id="ammoBar" style="width: 100%;"></div></div>
                        <div class="player-stat" style="margin-top: 10px;">Liv: <span id="playerLives">3</span></div>
                    </div>
                    <div class="sidebar-section">
                        <h3>Scoreboard</h3>
                        <div id="scoreboard" class="scoreboard"></div>
                    </div>
                    <div class="controls">
                        <strong>W/A/S/D</strong> Flytta<br>
                        <strong>Mus</strong> Sikta<br>
                        <strong>Vänsterkl</strong> Skjut<br>
                        <strong>Högerkl</strong> Reload
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket;
        let gameState = null;
        let currentGameId = null;
        let currentPlayerId = null;
        let isPlaying = false;

        const teamColors = ['#0099ff', '#ff3333', '#ffff00', '#00ff88'];
        const teamNames = ['Blå', 'Röd', 'Gul', 'Grön'];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Sound effect
        const shootSound = new Audio('/smg.mp3');
        shootSound.volume = 0.3;

        function playShootSound() {
            shootSound.currentTime = 0;
            shootSound.play().catch(e => console.log('Sound play failed:', e));
        }

        // Initialize socket
        function initSocket() {
            if (typeof io === 'undefined') {
                console.error('Socket.IO library not loaded!');
                setTimeout(initSocket, 100);
                return;
            }

            socket = io();

            socket.on('connect', () => {
                console.log('Connected to server');
                getGames();
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
            });

            socket.on('gameStateUpdate', (state) => {
                gameState = state;
                updateUI();
            });

            socket.on('gameStarted', () => {
                console.log('Game started!');
            });
        }

        // Game functions - GLOBAL
        function getGames() {
            if (!socket) return;
            socket.emit('getGames', games => {
                const list = document.getElementById('gameList');
                const sel = document.getElementById('selectedGame');
                list.innerHTML = '';
                sel.innerHTML = '';

                if (games.length === 0) {
                    list.innerHTML = '<p style="color: #666;">Inga spel</p>';
                } else {
                    games.forEach(g => {
                        const div = document.createElement('div');
                        div.className = 'game-item';
                        div.innerHTML = `Spel ${g.id.slice(-6)} - ${g.playerCount}/8`;
                        list.appendChild(div);

                        const opt = document.createElement('option');
                        opt.value = g.id;
                        opt.textContent = `Spel ${g.id.slice(-6)} (${g.playerCount}/8)`;
                        sel.appendChild(opt);
                    });
                }

                if (!sel.value && games.length > 0) {
                    sel.value = games[0].id;
                }
            });
        }

        function createGame() {
            if (!socket) return;
            socket.emit('createGame', 0, id => {
                currentGameId = id;
                console.log('Created game:', id);
                setTimeout(getGames, 100);
            });
        }

        function joinGame() {
            if (!socket) return;
            const gid = document.getElementById('selectedGame').value;
            if (!gid) return;

            socket.emit('joinGame', gid, {
                name: document.getElementById('playerName').value || 'Player',
                teamIndex: parseInt(document.getElementById('teamIndex').value),
                tankType: document.getElementById('tankType').value
            }, result => {
                if (result.success) {
                    currentGameId = gid;
                    currentPlayerId = result.playerId;
                    isPlaying = true;
                    document.getElementById('lobbyScreen').style.display = 'none';
                    document.getElementById('gameContainer').style.display = 'flex';
                }
            });
        }

        function leaveGame() {
            isPlaying = false;
            currentGameId = null;
            currentPlayerId = null;
            document.getElementById('lobbyScreen').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'none';
            if (socket) {
                socket.disconnect();
                setTimeout(() => {
                    socket.connect();
                    getGames();
                }, 500);
            }
        }

        // Draw a detailed tank
        function drawTank(ctx, x, y, angle, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const darkColor = 'rgba(30, 30, 40, 0.7)';

            // TRACKS
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-26, -16, 52, 6);
            ctx.fillRect(-26, 10, 52, 6);

            ctx.fillStyle = '#1a1a1a';
            for (let i = -24; i < 26; i += 6) {
                ctx.fillRect(i, -16, 4, 6);
                ctx.fillRect(i, 10, 4, 6);
            }

            // HULL
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-22, -12);
            ctx.lineTo(22, -12);
            ctx.lineTo(24, 12);
            ctx.lineTo(-24, 12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = darkColor;
            ctx.fillRect(-22, 6, 44, 6);

            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-8, -12);
            ctx.lineTo(-8, 12);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(8, -12);
            ctx.lineTo(8, 12);
            ctx.stroke();

            // WINDOWS
            ctx.fillStyle = '#001a33';
            ctx.fillRect(-16, -10, 6, 5);
            ctx.fillRect(-2, -10, 6, 5);
            ctx.fillRect(10, -10, 6, 5);
            ctx.fillRect(-8, 7, 6, 5);

            ctx.fillStyle = 'rgba(100, 150, 200, 0.3)';
            ctx.fillRect(-15, -9, 3, 2);
            ctx.fillRect(-1, -9, 3, 2);

            // TURRET
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, -1, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -1, 14, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(-5, -8, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, -1, 11, 0, Math.PI * 2);
            ctx.stroke();

            // CENTER DOME
            ctx.fillStyle = 'rgba(50, 50, 60, 0.9)';
            ctx.beginPath();
            ctx.arc(0, -2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0a1a2a';
            ctx.beginPath();
            ctx.arc(0, -2, 2, 0, Math.PI * 2);
            ctx.fill();

            // GUN
            ctx.strokeStyle = color;
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, -1);
            ctx.lineTo(35, -1);
            ctx.stroke();

            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, -1);
            ctx.lineTo(35, -1);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(2, -3);
            ctx.lineTo(33, -3);
            ctx.stroke();

            ctx.fillStyle = darkColor;
            ctx.fillRect(34, -4, 8, 6);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(35, -3, 6, 4);

            ctx.restore();
        }

        // Rendering
        function render() {
            if (!gameState) {
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const mapWidth = 500;
            const mapHeight = 400;

            // Clear
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Debug info
            ctx.fillStyle = '#00ff88';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`Spelare: ${gameState.players.length} | Skott: ${gameState.projectiles.length}`, 10, 20);

            if (gameState.players.length === 0) {
                return;
            }

            // Calculate scale - FIT without overflow
            const scaleX = canvas.width / mapWidth;
            const scaleY = canvas.height / mapHeight;
            const scale = Math.min(scaleX, scaleY);

            const offsetX = (canvas.width - mapWidth * scale) / 2;
            const offsetY = (canvas.height - mapHeight * scale) / 2;

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= mapWidth; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, mapHeight);
                ctx.stroke();
            }
            for (let i = 0; i <= mapHeight; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(mapWidth, i);
                ctx.stroke();
            }

            // Draw projectiles
            if (gameState.projectiles && gameState.projectiles.length > 0) {
                gameState.projectiles.forEach(p => {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
                    grad.addColorStop(0, 'rgba(255, 255, 0, 0.9)');
                    grad.addColorStop(0.7, 'rgba(255, 150, 0, 0.3)');
                    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw players
            gameState.players.forEach(player => {
                const color = teamColors[player.teamIndex];
                drawTank(ctx, player.x, player.y, player.angle, color);

                const barWidth = 45;
                const barHeight = 4;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(player.x - barWidth / 2, player.y - 40, barWidth, barHeight);

                ctx.fillStyle = player.hp > 50 ? '#00ff88' : player.hp > 20 ? '#ffff00' : '#ff3333';
                ctx.fillRect(player.x - barWidth / 2, player.y - 40, barWidth * (player.hp / 100), barHeight);

                ctx.fillStyle = color;
                ctx.font = 'bold 11px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(player.name, player.x, player.y - 53);
            });

            // Map border
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, mapWidth, mapHeight);

            ctx.restore();
        }

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Input
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        setInterval(() => {
            if (isPlaying && currentGameId && socket) {
                if (keys['w']) socket.emit('movePlayer', 'forward', currentGameId);
                if (keys['s']) socket.emit('movePlayer', 'backward', currentGameId);
                if (keys['a']) socket.emit('movePlayer', 'left', currentGameId);
                if (keys['d']) socket.emit('movePlayer', 'right', currentGameId);
            }
        }, 30);

        canvas.addEventListener('mousemove', e => {
            if (!isPlaying || !gameState || !currentPlayerId || !socket) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            const player = gameState.players.find(p => p.id === currentPlayerId);
            if (!player) return;

            const mapWidth = 500;
            const mapHeight = 400;
            const scaleX = canvas.width / mapWidth;
            const scaleY = canvas.height / mapHeight;
            const scale = Math.min(scaleX, scaleY);
            const offsetX = (canvas.width - mapWidth * scale) / 2;
            const offsetY = (canvas.height - mapHeight * scale) / 2;

            const gx = (mx - offsetX) / scale;
            const gy = (my - offsetY) / scale;

            const angle = Math.atan2(gy - player.y, gx - player.x);
            socket.emit('aim', angle, currentGameId);
        });

        canvas.addEventListener('click', () => {
            if (isPlaying && socket) {
                playShootSound();
                socket.emit('shoot', currentGameId);
            }
        });

        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            if (isPlaying && socket) socket.emit('reload', currentGameId);
        });

        function updateUI() {
            if (!gameState) return;

            const player = gameState.players.find(p => p.id === currentPlayerId);
            if (player) {
                document.getElementById('playerHealth').textContent = player.hp;
                document.getElementById('playerAmmo').textContent = player.ammo;
                document.getElementById('playerLives').textContent = player.lives;
                document.getElementById('hpBar').style.width = (player.hp / 100 * 100) + '%';
                document.getElementById('ammoBar').style.width = (player.ammo / 10 * 100) + '%';
            }

            document.getElementById('scoreBlue').textContent = gameState.scores[0];
            document.getElementById('scoreRed').textContent = gameState.scores[1];
            document.getElementById('scoreYellow').textContent = gameState.scores[2];
            document.getElementById('scoreGreen').textContent = gameState.scores[3];

            const sb = document.getElementById('scoreboard');
            sb.innerHTML = gameState.players
                .sort((a, b) => b.kills - a.kills)
                .map(p => `<div class="scoreboard-entry"><div class="name" style="color: ${teamColors[p.teamIndex]}">${p.name}</div><div class="stats">K:${p.kills} D:${p.deaths}</div></div>`)
                .join('');
        }

        initSocket();

        setInterval(() => {
            if (socket && !isPlaying) getGames();
        }, 3000);
    </script>
</body>
</html>
