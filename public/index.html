<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PvP Shooter</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; }

    #ui {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font: 16px system-ui, -apple-system, Segoe UI, Roboto, Arial; color:#fff;
      background: rgba(0,0,0,.55); user-select:none; z-index: 10;
    }
    #ui .box {
      max-width: 780px; padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.35);
      border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #ui h1 { margin:0 0 10px; font-size: 20px; }
    #ui p { margin:8px 0; opacity:.92; line-height:1.5; }
    #ui .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    #ui label { opacity:.9; }
    #ui input {
      width: 220px; padding: 9px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color:#fff; outline:none;
    }
    #ui button {
      padding: 9px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.14); color:#fff;
      cursor:pointer; font-size:15px;
    }
    #ui button:hover { background: rgba(255,255,255,.22); }
    #ui button:disabled { opacity: 0.5; cursor: not-allowed; }

    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5; width: 0; height: 0;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.92);
    }
    #crosshair::before { width: 16px; height: 2px; left: -8px; top: -1px; }
    #crosshair::after  { width: 2px; height: 16px; left: -1px; top: -8px; }

    #hitflash {
      position: fixed; inset:0; pointer-events:none; z-index:7;
      background: rgba(220,0,0,0); transition: background 0.08s;
    }

    #hud-bar {
      position: fixed; bottom:0; left:0; right:0; height: 56px;
      background: #1a0000; border-top: 3px solid #550000;
      display: flex; align-items: center; padding: 0 24px; gap: 26px;
      z-index: 5; pointer-events: none;
      font: bold 28px ui-monospace, monospace; color: #ff4400; text-shadow: 0 0 8px #ff2200;
    }
    .hud-item { display:flex; flex-direction:column; align-items:center; }
    .hud-label { font-size:9px; letter-spacing:2px; color:#ff6600; opacity:0.7; font-weight:normal; margin-bottom:1px; }
    .hud-value { line-height:1; }
    #hud-face {
      width:44px; height:44px; background:#cc2200; border:2px solid #881100; border-radius:2px;
      display:flex; align-items:center; justify-content:center; font-size:22px;
    }
    #hud-room { font-size:11px; letter-spacing:2px; color:#ff8800; opacity:0.6; margin-left:auto; font-weight:normal; }

    #toast {
      position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
      color:#fff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15);
      padding: 8px 14px; border-radius: 12px; font: 13px system-ui;
      opacity: 0; transition: opacity .2s ease; pointer-events:none; z-index: 6;
    }

    #killfeed{
      position: fixed; left: 12px; top: 12px; z-index: 6;
      display:flex; flex-direction:column; gap:6px;
      font: 12px system-ui; color:#fff;
      pointer-events:none;
    }
    #killfeed .line{
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.12);
      padding: 6px 10px; border-radius: 10px;
      max-width: 320px;
    }

    #scoreboard{
      position: fixed; right: 12px; top: 12px; z-index: 6;
      min-width: 240px;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 12px; border-radius: 12px;
      font: 12px system-ui; color:#fff;
      pointer-events:none;
    }
    #scoreboard .hdr{ font-weight: 700; opacity: .9; margin-bottom: 8px; }
    #scoreboard .row{ display:flex; justify-content:space-between; gap:10px; padding: 2px 0; }
    #scoreboard .me{ color: #ffe27a; }

    #pairkills{
      position: fixed; right: 12px; top: 168px; z-index: 6;
      min-width: 240px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      padding: 10px 12px; border-radius: 12px;
      font: 12px system-ui; color:#fff;
      pointer-events:none;
    }
    #pairkills .hdr{ font-weight: 700; opacity: .9; margin-bottom: 8px; }
    #pairkills .row{ display:flex; justify-content:space-between; gap:10px; padding: 2px 0; opacity:.92; }

    #hud-weapon { min-width: 120px; }
  </style>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }}
  </script>
</head>

<body>
  <div id="ui">
    <div class="box">
      <h1>PvP Shooter</h1>
      <p class="row">
        <label>Namn:</label>
        <input id="name" maxlength="16" placeholder="Ditt namn" />
        <label>Rum:</label>
        <input id="room" maxlength="16" value="lobby" />
        <button id="join" disabled>Laddar ljud…</button>
      </p>
      <p>
        <b>W/S/A/D</b> = rör dig &bull;
        <b>Mus</b> = sikta &bull;
        <b>Klick</b> = skjut &bull;
        <b>1</b>=Shotgun &bull; <b>2</b>=SMG &bull;
        <b>Space</b> = hoppa &bull;
        <b>C/Ctrl</b> = ducka &bull;
        <b>R</b> = ladda om &bull;
        <b>ESC</b> = meny
      </p>
      <p id="status" style="opacity:.9"></p>
    </div>
  </div>

  <div id="hitflash"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>

  <div id="killfeed"></div>
  <div id="scoreboard"></div>
  <div id="pairkills"></div>

  <div id="hud-bar">
    <div class="hud-item"><div class="hud-label">HÄLSA</div><div class="hud-value" id="hud-hp">100</div></div>
    <div id="hud-face">😐</div>
    <div class="hud-item"><div class="hud-label">AMMO</div><div class="hud-value" id="hud-ammo">50</div></div>
    <div class="hud-item" id="hud-weapon">
      <div class="hud-label">VAPEN</div><div class="hud-value" id="hud-weapon-name">SHOTGUN</div>
    </div>
    <div class="hud-item" style="font-size:16px"><div class="hud-label">SPELARE</div><div class="hud-value" id="hud-players">–</div></div>
    <div id="hud-room">OFFLINE</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    // =========================
    // Ljud
    // =========================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds   = { shoot: null, shell: null, reload: null, smg: null };
    const joinBtn  = document.getElementById("join");

    async function loadSound(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
      const ab  = await res.arrayBuffer();
      return audioCtx.decodeAudioData(ab);
    }

    function playBuffer(buf, delay = 0, volume = 1.0, rate = 1.0) {
      if (!buf) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const src  = audioCtx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = rate;
      const gain = audioCtx.createGain();
      gain.gain.value = volume;
      src.connect(gain);
      gain.connect(audioCtx.destination);
      src.start(audioCtx.currentTime + delay);
    }

    Promise.all([
      loadSound('/Shotgun2.mp3'),
      loadSound('/Shotgun3.mp3'),
      loadSound('/Shotgun1.mp3'),
      loadSound('/smg.mp3'),
    ]).then(([shoot, shell, reload, smg]) => {
      sounds.shoot  = shoot;
      sounds.shell  = shell;
      sounds.reload = reload;
      sounds.smg    = smg;
      joinBtn.disabled    = false;
      joinBtn.textContent = "Join";
    }).catch((e) => {
      console.warn("Sound load failed:", e);
      joinBtn.disabled    = false;
      joinBtn.textContent = "Join (inget ljud)";
    });

    function playSound(type) {
      if (type === 'shoot') {
        playBuffer(sounds.shoot,  0.00, 1.0);
        playBuffer(sounds.shell,  0.20, 0.6);
        playBuffer(sounds.reload, 0.55, 0.5);
      }
      if (type === 'reload') {
        playBuffer(sounds.reload, 0.00, 0.9);
        playBuffer(sounds.shell,  0.30, 0.5);
      }
      if (type === 'smg') {
        const r = 0.98 + Math.random() * 0.06;
        playBuffer(sounds.smg, 0.00, 0.85, r);
      }
    }

    // =========================
    // Renderer
    // =========================
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:"high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.autoClear = true;

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);

    // =========================
    // Texturer + Skybox
    // =========================
    const texLoader = new THREE.TextureLoader();
    const cubeLoader = new THREE.CubeTextureLoader();

    function loadTex(url) {
      const t = texLoader.load(url);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return t;
    }

    const texWall  = loadTex("/wall.png");
    const texFloor = loadTex("/floor.png");
    texFloor.repeat.set(8, 6);
    texWall.repeat.set(6, 3);

    const sky = cubeLoader.load([
      "/sky_px.png", "/sky_nx.png",
      "/sky_py.png", "/sky_ny.png",
      "/sky_pz.png", "/sky_nz.png",
    ]);
    sky.colorSpace = THREE.SRGBColorSpace;
    scene.background = sky;

    scene.fog = new THREE.Fog(0x88a8cc, 35, 160);

    // =========================
    // Ljus
    // =========================
    scene.add(new THREE.AmbientLight(0xffffff, 1.6));

    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(6, 12, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1;
    key.shadow.camera.far  = 80;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.9);
    fill.position.set(-6, 8, -4);
    scene.add(fill);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    // =========================
    // UI helpers
    // =========================
    const ui       = document.getElementById("ui");
    const statusEl = document.getElementById("status");
    const toast    = document.getElementById("toast");

    function showToast(text) {
      toast.textContent   = text;
      toast.style.opacity = "1";
      setTimeout(() => toast.style.opacity = "0", 900);
    }

    controls.addEventListener("lock",   () => ui.style.display = "none");
    controls.addEventListener("unlock", () => ui.style.display = "flex");

    let connected = false;
    ui.addEventListener("click", e => {
      if (["INPUT","BUTTON","LABEL"].includes(e.target.tagName)) return;
      if (connected) controls.lock();
    });

    // Killfeed / scoreboard / pairkills
    const killfeedEl = document.getElementById("killfeed");
    const scoreboardEl = document.getElementById("scoreboard");
    const pairkillsEl = document.getElementById("pairkills");

    const killfeed = [];
    function addKillLine(text) {
      killfeed.unshift({ text, t: performance.now() });
      killfeed.splice(6);
      killfeedEl.innerHTML = killfeed.map(k => `<div class="line">${escapeHtml(k.text)}</div>`).join("");
    }
    function renderScoreboard(list) {
      if (!Array.isArray(list)) return;
      const rows = [...list].sort((a,b)=> (b.kills - a.kills) || (a.deaths - b.deaths));
      scoreboardEl.innerHTML =
        `<div class="hdr">SCORE (K/D)</div>` +
        rows.map(p => {
          const me = (p.id === player.id) ? "me" : "";
          return `<div class="row ${me}"><span>${escapeHtml(p.name||"player")}</span><span>${p.kills||0}/${p.deaths||0}</span></div>`;
        }).join("");
    }
    function renderPairKills(list) {
      if (!Array.isArray(list)) return;
      pairkillsEl.innerHTML =
        `<div class="hdr">VEM DÖDADE VEM</div>` +
        list.slice(0, 10).map(r =>
          `<div class="row"><span>${escapeHtml(r.killerName)} → ${escapeHtml(r.victimName)}</span><span>${r.count}</span></div>`
        ).join("");
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // =========================
    // Vapen texturer/material
    // =========================
    const texWeaponWood  = loadTex("/weapon_wood.png");
    const texWeaponMetal = loadTex("/weapon_metal.png");

    const mMetal = new THREE.MeshStandardMaterial({
      map: texWeaponMetal,
      roughness: 0.35,
      metalness: 0.85,
    });
    const mWood = new THREE.MeshStandardMaterial({
      map: texWeaponWood,
      roughness: 0.75,
      metalness: 0.05,
    });
    const mHand  = new THREE.MeshStandardMaterial({ color: 0xb86030, roughness: 0.9, metalness: 0.0 });
    const mHandL = new THREE.MeshStandardMaterial({ color: 0xd07848, roughness: 0.9, metalness: 0.0 });

    // =========================
    // First-person weapon system (shotgun + smg)
    // =========================
    const weaponRoot = new THREE.Group();
    weaponRoot.position.set(0.22, -0.20, -0.30);
    weaponRoot.rotation.y = 0.06;
    weaponRoot.visible = false;
    camera.add(weaponRoot);

    const weaponShotgun = new THREE.Group();
    const weaponSmg = new THREE.Group();
    weaponRoot.add(weaponShotgun);
    weaponRoot.add(weaponSmg);

    function addBoxTo(group, w, h, d, mat, x, y, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
      m.position.set(x,y,z);
      group.add(m);
      return m;
    }

    // --- Shotgun model (textured)
    addBoxTo(weaponShotgun, 0.055,0.055,1.1,   mMetal,  0,      0.005, -0.55);
    addBoxTo(weaponShotgun, 0.035,0.008,1.08,  mMetal,  0,      0.034, -0.55);
    addBoxTo(weaponShotgun, 0.042,0.042,0.78,  mMetal,  0,     -0.052, -0.39);
    addBoxTo(weaponShotgun, 0.11, 0.10, 0.28,  mMetal,  0,      0.005,  0.08);
    addBoxTo(weaponShotgun, 0.085,0.065,0.24,  mMetal,  0,      0.010,  0.08);
    addBoxTo(weaponShotgun, 0.08, 0.010,0.22,  mMetal,  0,      0.052,  0.07);

    addBoxTo(weaponShotgun, 0.10, 0.068,0.22,  mWood,   0,     -0.018, -0.22);
    addBoxTo(weaponShotgun, 0.076,0.040,0.18,  mWood,   0,     -0.008, -0.22);
    addBoxTo(weaponShotgun, 0.088,0.088,0.26,  mWood,   0,     -0.004,  0.29);
    addBoxTo(weaponShotgun, 0.068,0.060,0.22,  mWood,   0,      0.004,  0.28);
    addBoxTo(weaponShotgun, 0.092,0.092,0.014, mMetal,  0,     -0.004,  0.42);

    addBoxTo(weaponShotgun, 0.065,0.13, 0.08,  mWood,   0.006,-0.085,   0.12);
    addBoxTo(weaponShotgun, 0.046,0.10, 0.06,  mWood,   0.006,-0.072,   0.12);

    addBoxTo(weaponShotgun, 0.088,0.095,0.13,  mHand,   0.042,-0.098,   0.14);
    addBoxTo(weaponShotgun, 0.065,0.068,0.10,  mHandL,  0.042,-0.088,   0.14);
    addBoxTo(weaponShotgun, 0.022,0.065,0.022, mHand,   0.018,-0.155,   0.10);
    addBoxTo(weaponShotgun, 0.022,0.065,0.022, mHand,   0.042,-0.158,   0.10);
    addBoxTo(weaponShotgun, 0.022,0.060,0.022, mHand,   0.066,-0.152,   0.10);
    addBoxTo(weaponShotgun, 0.018,0.050,0.022, mHand,   0.088,-0.144,   0.10);
    addBoxTo(weaponShotgun, 0.022,0.048,0.048, mHand,   0.004,-0.068,   0.08);

    addBoxTo(weaponShotgun, 0.088,0.075,0.15,  mHand,   0.042,-0.055,  -0.22);
    addBoxTo(weaponShotgun, 0.065,0.055,0.12,  mHandL,  0.042,-0.048,  -0.22);
    addBoxTo(weaponShotgun, 0.022,0.058,0.022, mHand,   0.018,-0.115,  -0.26);
    addBoxTo(weaponShotgun, 0.022,0.058,0.022, mHand,   0.042,-0.118,  -0.26);
    addBoxTo(weaponShotgun, 0.022,0.052,0.022, mHand,   0.066,-0.112,  -0.26);
    addBoxTo(weaponShotgun, 0.018,0.044,0.022, mHand,   0.088,-0.105,  -0.26);

    // --- SMG model
    addBoxTo(weaponSmg, 0.05, 0.05, 0.55, mMetal, 0.00, 0.01, -0.40);
    addBoxTo(weaponSmg, 0.13, 0.09, 0.22, mMetal, 0.00, 0.00,  0.02);
    addBoxTo(weaponSmg, 0.11, 0.03, 0.18, mMetal, 0.00, 0.06,  0.02);
    addBoxTo(weaponSmg, 0.06, 0.16, 0.05, mMetal, 0.02,-0.10, -0.00);
    addBoxTo(weaponSmg, 0.06, 0.10, 0.06, mWood,  0.02,-0.09,  0.08);
    addBoxTo(weaponSmg, 0.04, 0.04, 0.22, mMetal, -0.03, 0.03,  0.22);
    addBoxTo(weaponSmg, 0.06, 0.03, 0.12, mMetal, -0.02, 0.02,  0.32);
    addBoxTo(weaponSmg, 0.085,0.075,0.12,  mHand,  0.05,-0.06, -0.10);
    addBoxTo(weaponSmg, 0.065,0.055,0.10,  mHandL, 0.05,-0.05, -0.10);
    addBoxTo(weaponSmg, 0.085,0.075,0.12,  mHand,  0.05,-0.05,  0.14);
    addBoxTo(weaponSmg, 0.065,0.055,0.10,  mHandL, 0.05,-0.04,  0.14);

    // Weapon visibility switching
    let currentWeapon = "shotgun";
    function setWeapon(w) {
      if (w !== "shotgun" && w !== "smg") return;
      currentWeapon = w;
      weaponShotgun.visible = (w === "shotgun");
      weaponSmg.visible = (w === "smg");
      wsSend({ t:"weapon", weapon: w });
      updateHUD();
      attachMuzzleToActive();
    }

    // Weapon light
    const wKeyLight = new THREE.PointLight(0xffffff, 1.5, 3);
    wKeyLight.position.set(0.3, 0.2, -0.1);
    camera.add(wKeyLight);

    // Muzzle flash setup (sprite + light, re-attached per weapon)
    const muzzleLight = new THREE.PointLight(0xff8800, 0, 4);

    const muzzleCanvas = document.createElement('canvas');
    muzzleCanvas.width = muzzleCanvas.height = 128;
    const mCtx = muzzleCanvas.getContext('2d');
    const grad = mCtx.createRadialGradient(64,64,2, 64,64,64);
    grad.addColorStop(0,    'rgba(255,255,220,1)');
    grad.addColorStop(0.08, 'rgba(255,200,50,1)');
    grad.addColorStop(0.25, 'rgba(255,120,0,0.8)');
    grad.addColorStop(1,    'rgba(255,60,0,0)');
    mCtx.fillStyle = grad; mCtx.fillRect(0,0,128,128);
    mCtx.strokeStyle = 'rgba(255,220,80,0.9)';
    for (let a=0; a<8; a++) {
      const ang = a * Math.PI/4;
      mCtx.lineWidth = 3 - a%2*1.5;
      mCtx.beginPath(); mCtx.moveTo(64,64);
      mCtx.lineTo(64+Math.cos(ang)*62, 64+Math.sin(ang)*62); mCtx.stroke();
    }
    const muzzleTex = new THREE.CanvasTexture(muzzleCanvas);
    const muzzleSpriteMat = new THREE.SpriteMaterial({
      map: muzzleTex, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const muzzleSprite = new THREE.Sprite(muzzleSpriteMat);
    muzzleSprite.scale.set(0.15, 0.15, 1);

    function attachMuzzleToActive() {
      if (muzzleLight.parent) muzzleLight.parent.remove(muzzleLight);
      if (muzzleSprite.parent) muzzleSprite.parent.remove(muzzleSprite);

      const active = (currentWeapon === "shotgun") ? weaponShotgun : weaponSmg;

      const z = (currentWeapon === "shotgun") ? -1.1 : -0.70;
      muzzleLight.position.set(0, 0.01, z);
      muzzleSprite.position.set(0, 0.01, z);

      active.add(muzzleLight);
      active.add(muzzleSprite);
    }

    attachMuzzleToActive();

    let muzzleFlashLife = 0, weaponBobT = 0, weaponKick = 0;
    controls.addEventListener("lock",   () => weaponRoot.visible = true);
    controls.addEventListener("unlock", () => weaponRoot.visible = false);

    // =========================
    // Bullet tracers
    // =========================
    const tracerCanvas = document.createElement('canvas');
    tracerCanvas.width = 32; tracerCanvas.height = 8;
    const tCtx = tracerCanvas.getContext('2d');
    const tGrad = tCtx.createLinearGradient(0,0,32,0);
    tGrad.addColorStop(0,   'rgba(255,255,200,0)');
    tGrad.addColorStop(0.3, 'rgba(255,220,50,1)');
    tGrad.addColorStop(0.7, 'rgba(255,200,50,1)');
    tGrad.addColorStop(1,   'rgba(255,255,200,0)');
    tCtx.fillStyle = tGrad; tCtx.fillRect(0,0,32,8);
    const tracerTex = new THREE.CanvasTexture(tracerCanvas);
    const tracers = [];

    function spawnTracer(from, dir) {
      const length = 0.8;
      const geo  = new THREE.CylinderGeometry(0.02, 0.02, length, 5);
      geo.rotateX(Math.PI / 2);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffee66 }));
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tracerTex, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, opacity: 1,
      }));
      glow.scale.set(length * 1.2, 0.10, 1);
      const group = new THREE.Group();
      group.add(mesh); group.add(glow);
      group.position.copy(from);
      const up = Math.abs(dir.y) < 0.99 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
      group.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(), dir, up));
      group.rotateX(Math.PI / 2);
      scene.add(group);
      tracers.push({ group, dir: dir.clone().normalize(), life: 0.22, speed: 120 });
    }

    function updateTracers(dt) {
      for (let i = tracers.length-1; i >= 0; i--) {
        const t = tracers[i];
        t.group.position.addScaledVector(t.dir, t.speed * dt);
        t.life -= dt;
        if (t.life <= 0) { scene.remove(t.group); tracers.splice(i, 1); }
      }
    }

    // =========================

    const localRaycaster = new THREE.Raycaster();
    function localShootRaycast() {
      localRaycaster.setFromCamera(new THREE.Vector2(0,0), camera);
      const targets = [...others.values()].flatMap(o => {
        const meshes = [];
        o.humanoid.traverse(m => { if (m.isMesh) meshes.push(m); });
        return meshes;
      });
      const hits = localRaycaster.intersectObjects(targets);
      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        const hitOther = [...others.values()].find(o => {
          let found = false;
          o.humanoid.traverse(m => { if (m === hitMesh) found = true; });
          return found;
        });
        if (hitOther) showToast(`TRÄFF på ${hitOther.last.name || "spelare"}!`);
      }
    }

    // =========================
    // Movement
    // =========================
    const keys = new Set();
    addEventListener("keydown", e => keys.add(e.code));
    addEventListener("keyup",   e => keys.delete(e.code));

    const MOVE_SPEED   = 10.4;
    const ACCEL_GROUND = 30.0;
    const FRICTION     = 10.0;
    const STRAFE_BIAS  = 1.0;
    const GRAVITY      = 22.0;
    const JUMP_SPEED   = 7.0;
    const EYE_STAND    = 1.7;
    const EYE_CROUCH   = 0.75;
    const CROUCH_SPEED = 8.0;

    const player = {
      id: null,
      pos: new THREE.Vector3(cellSize*2, 0, cellSize*2),
      vel: new THREE.Vector3(),
      radius: 0.55, hp: 100, ammo: 50, room: "lobby",
      onGround: true, eyeY: EYE_STAND, crouching: false,
    };
    controls.getObject().position.set(player.pos.x, EYE_STAND, player.pos.z);

    function circleHitsWall(x, z, r) {
      const minCX = Math.floor((x-r)/cellSize), maxCX = Math.floor((x+r)/cellSize);
      const minCZ = Math.floor((z-r)/cellSize), maxCZ = Math.floor((z+r)/cellSize);
      for (let cz=minCZ; cz<=maxCZ; cz++) for (let cx=minCX; cx<=maxCX; cx++) {
        if (!isWallCell(cx,cz)) continue;
        const px = Math.max(cx*cellSize, Math.min(x, cx*cellSize+cellSize));
        const pz = Math.max(cz*cellSize, Math.min(z, cz*cellSize+cellSize));
        if ((x-px)**2 + (z-pz)**2 < r*r) return true;
      }
      return false;
    }

    function accelerate(vx, vz, wx, wz, wspd, accel, dt) {
      const cur = vx*wx + vz*wz, add = wspd - cur;
      if (add <= 0) return { vx, vz };
      const a = Math.min(accel*dt*wspd, add);
      return { vx: vx+a*wx, vz: vz+a*wz };
    }

    function applyFriction(vx, vz, friction, dt) {
      const spd = Math.hypot(vx,vz); if (spd < 1e-6) return { vx:0, vz:0 };
      const ns = Math.max(0, spd - spd*friction*dt);
      return { vx: vx*(ns/spd), vz: vz*(ns/spd) };
    }

    function movePlayer(dt) {
      const fwd = new THREE.Vector3(); controls.getDirection(fwd); fwd.y=0; fwd.normalize();
      const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();

      let f=0, s=0;
      if (keys.has("KeyW")||keys.has("ArrowUp"))    f+=1;
      if (keys.has("KeyS")||keys.has("ArrowDown"))  f-=1;
      if (keys.has("KeyA")||keys.has("ArrowLeft"))  s-=1;
      if (keys.has("KeyD")||keys.has("ArrowRight")) s+=1;

      player.crouching = keys.has("KeyC")||keys.has("ControlLeft")||keys.has("ControlRight");

      if (keys.has("Space") && player.onGround) {
        player.vel.y = JUMP_SPEED; player.onGround = false;
      }

      const wish = new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,s*STRAFE_BIAS);
      const spd  = player.crouching ? MOVE_SPEED*0.5 : MOVE_SPEED;
      const wspd = wish.lengthSq() > 0 ? (wish.normalize(), spd) : 0;

      const fr = applyFriction(player.vel.x, player.vel.z, FRICTION, dt);
      player.vel.x = fr.vx; player.vel.z = fr.vz;
      if (wspd > 0) {
        const acc = accelerate(player.vel.x, player.vel.z, wish.x, wish.z, wspd, ACCEL_GROUND, dt);
        player.vel.x = acc.vx; player.vel.z = acc.vz;
      }

      if (!player.onGround) player.vel.y -= GRAVITY * dt;
      player.pos.x += player.vel.x * dt;
      player.pos.z += player.vel.z * dt;
      player.pos.y += player.vel.y * dt;

      if (player.pos.y <= 0) {
        player.pos.y = 0; player.vel.y = 0; player.onGround = true;
      } else { player.onGround = false; }

      const r = player.radius;
      if (circleHitsWall(player.pos.x, player.pos.z, r)) { player.pos.x -= player.vel.x*dt; player.vel.x = 0; }
      if (circleHitsWall(player.pos.x, player.pos.z, r)) { player.pos.z -= player.vel.z*dt; player.vel.z = 0; }

      const targetEye = player.crouching ? EYE_CROUCH : EYE_STAND;
      player.eyeY += (targetEye - player.eyeY) * Math.min(1, CROUCH_SPEED*dt);
      controls.getObject().position.set(player.pos.x, player.pos.y+player.eyeY, player.pos.z);

      const speedNow = Math.hypot(player.vel.x, player.vel.z);
      weaponBobT += speedNow * 0.004;
      const bobY = Math.sin(weaponBobT*6) * Math.min(speedNow,10) * 0.003;
      const bobX = Math.sin(weaponBobT*3) * Math.min(speedNow,10) * 0.001;
      weaponKick = Math.max(0, weaponKick - 0.005);
      weaponRoot.position.set(0.22+bobX, -0.20+bobY+weaponKick, -0.30);
    }

    // =========================
    // Network
    // =========================
    const WS_URL = (location.protocol==="https:"?"wss://":"ws://") + location.host;
    let ws = null;

    function wsSend(obj) {
      if (!ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify(obj));
    }

    function connectAndJoin() {
      const name = document.getElementById("name").value || "player";
      const room = document.getElementById("room").value || "lobby";
      player.room = room;
      statusEl.textContent = "Ansluter…";
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connected = true;
        statusEl.textContent = "Ansluten!";
        wsSend({ t:"join", name, room });
      };
      ws.onclose = () => {
        connected = false; player.id = null;
        statusEl.textContent = "Frånkopplad.";
        for (const id of [...others.keys()]) removeOther(id);
        ui.style.display = "flex";
      };
      ws.onerror = () => statusEl.textContent = "Anslutningsfel.";
      ws.onmessage = ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.scoreboard) renderScoreboard(msg.scoreboard);
        if (msg.pairKills) renderPairKills(msg.pairKills);

        if (msg.t === "welcome") {
          player.id = msg.id; player.hp = msg.you.hp;
          player.pos.x = msg.you.x; player.pos.z = msg.you.z;
          controls.getObject().position.set(player.pos.x, player.eyeY, player.pos.z);

          for (const p of msg.players) {
            if (p.id === player.id) continue;
            const o = ensureOther(p.id, p.name);
            o.last = {...p}; o.render.x = p.x; o.render.z = p.z;
          }

          showToast(`Joined: ${msg.room}`);
          ui.style.display = "none";
          setTimeout(() => controls.lock(), 50);

          setWeapon("shotgun");
          return;
        }

        if (msg.t === "player_join") {
          if (msg.p.id === player.id) return;
          const o = ensureOther(msg.p.id, msg.p.name);
          o.last = {...msg.p}; o.render.x = msg.p.x; o.render.z = msg.p.z;
          showToast(`${msg.p.name} joined`); return;
        }

        if (msg.t === "player_leave") { removeOther(msg.id); return; }

        if (msg.t === "player_name") {
          const o = ensureOther(msg.id, msg.name);
          o.label.material.map = makeNameLabel(msg.name);
          o.label.material.needsUpdate = true; o.last.name = msg.name; return;
        }

        if (msg.t === "weapon") {
          const o = others.get(msg.id);
          if (o) o.last.weapon = msg.weapon;
          return;
        }

        // Motståndares skott: tracer + muzzle flash (yaw + pitch)
        if (msg.t === "shot") {
          if (msg.id === player.id) return;
          const o = others.get(msg.id);
          if (!o) return;

          o.flashLife = 1.0;
          o.flashLight.intensity = 5;

          const yaw = Number(msg.yaw) || o.last.yaw || 0;
          const pitch = Number(msg.pitch) || o.last.pitch || 0;

          const dir = new THREE.Vector3(
            -Math.sin(yaw) * Math.cos(pitch),
             Math.sin(pitch),
            -Math.cos(yaw) * Math.cos(pitch)
          ).normalize();

          const from = new THREE.Vector3(o.render.x, 1.25, o.render.z).addScaledVector(dir, 0.9);
          spawnTracer(from, dir);
          return;
        }

        if (msg.t === "hit") {
          if (msg.to === player.id) {
            player.hp = msg.hp;
            triggerHitFlash();
            showToast("TRÄFFAD!");
          }
          if (msg.from === player.id) showToast("TRÄFF!");
          const shooter = others.get(msg.from);
          if (shooter) { shooter.flashLife = 1.0; shooter.flashLight.intensity = 5; }
          const o = others.get(msg.to); if (o) o.last.hp = msg.hp;
          return;
        }

        if (msg.t === "kill") {
          addKillLine(`${msg.killerName} dödade ${msg.victimName} (${msg.pairCount}x)`);
          return;
        }

        if (msg.t === "respawn") {
          if (msg.id === player.id) {
            player.hp = msg.hp; player.pos.x = msg.x; player.pos.z = msg.z;
            player.vel.set(0,0,0); showToast("RESPAWN");
          } else {
            const o = ensureOther(msg.id, others.get(msg.id)?.last?.name || "player");
            o.last.x = msg.x; o.last.z = msg.z; o.last.hp = msg.hp;
            o.render.x = msg.x; o.render.z = msg.z;
          }
          return;
        }

        if (msg.t === "state") {
          for (const p of msg.players) {
            if (p.id === player.id) { player.hp = p.hp; continue; }
            const o = ensureOther(p.id, p.name);
            o.last = {...p};
          }
          return;
        }
      };
    }

    // =========================
    // Input -> server
    // =========================
    function getYawPitch() {
      return { yaw: controls.getObject().rotation.y, pitch: camera.rotation.x };
    }
    function computeWorldInput() {
      const fwd = new THREE.Vector3(); controls.getDirection(fwd); fwd.y=0; fwd.normalize();
      const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
      let f=0, s=0;
      if (keys.has("KeyW")||keys.has("ArrowUp"))    f+=1;
      if (keys.has("KeyS")||keys.has("ArrowDown"))  f-=1;
      if (keys.has("KeyA")||keys.has("ArrowLeft"))  s-=1;
      if (keys.has("KeyD")||keys.has("ArrowRight")) s+=1;
      const v = new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,s);
      if (v.lengthSq() > 0) v.normalize();
      return { ix: v.x, iz: v.z };
    }

    // =========================
    // Shooting
    // =========================
    const hitflash = document.getElementById("hitflash");

    function triggerMuzzleFlash() {
      weaponKick = 0.04; muzzleFlashLife = 1.0;
      muzzleLight.intensity = 6; muzzleSpriteMat.opacity = 1;
      hitflash.style.background = "rgba(255,210,100,0.06)";
      setTimeout(() => hitflash.style.background = "", 55);
    }

    function doSingleShot() {
      if (player.ammo <= 0) { showToast("TOMT! (R = ladda om)"); return false; }
      player.ammo--;

      const dir  = new THREE.Vector3(); camera.getWorldDirection(dir);
      const from = camera.position.clone().addScaledVector(dir, 0.5);
      spawnTracer(from, dir);
      localShootRaycast();

      const { yaw, pitch } = getYawPitch();
      wsSend({ t:"shoot", yaw, pitch, weapon: currentWeapon });

      triggerMuzzleFlash();
      return true;
    }

    // Shotgun cooldown (single shot)
    let shootCooldown = 0;

    // SMG full-auto tuning (ändra SMG_RPS för att testa hastigheter)
    let SMG_RPS = 10.0;          // skott per sekund: testa 6, 8, 10, 12, 15
    let smgTriggerHeld = false;  // håller musen nere?
    let smgShotAcc = 0;          // ackumulator (tick-baserad timing)

    addEventListener("mousedown", e => {
      if (e.button !== 0 || !controls.isLocked) return;

      if (currentWeapon === "shotgun") {
        if (shootCooldown > 0) return;
        if (!doSingleShot()) return;

        playSound('shoot');
        shootCooldown = 0.7;
        return;
      }

      if (currentWeapon === "smg") {
        smgTriggerHeld = true;

        // Känns bättre: direkt första skottet på down
        smgShotAcc = 0;
        const ok = doSingleShot();
        if (ok) playSound("smg");
        return;
      }
    });

    addEventListener("mouseup", e => {
      if (e.button === 0) smgTriggerHeld = false;
    });

    addEventListener("keydown", e => {
      if (!controls.isLocked) return;

      if (e.code === "KeyR") {
        player.ammo = 50;
        playSound('reload');
        showToast("LADDAT!");
        updateHUD();
      }

      if (e.code === "Digit1") { setWeapon("shotgun"); showToast("SHOTGUN"); }
      if (e.code === "Digit2") { setWeapon("smg");    showToast("SMG (auto)"); }

      // Snabbtest av SMG-hastighet (valfritt, men bra för dig):
      if (e.code === "Minus") { SMG_RPS = Math.max(1, SMG_RPS - 1); showToast(`SMG RPS: ${SMG_RPS}`); }
      if (e.code === "Equal") { SMG_RPS = Math.min(30, SMG_RPS + 1); showToast(`SMG RPS: ${SMG_RPS}`); }
    });

    let inputSendAccum = 0;

    // =========================
    // Update others
    // =========================
    function updateOthers(dt) {
      const interp = 1 - Math.exp(-18*dt);
      for (const [id, o] of others) {
        o.render.x += (o.last.x - o.render.x) * interp;
        o.render.z += (o.last.z - o.render.z) * interp;
        o.humanoid.position.set(o.render.x, 0, o.render.z);

        if (o.last.yaw !== undefined) o.humanoid.rotation.y = o.last.yaw + Math.PI;
        o.label.position.set(o.render.x, 2.4, o.render.z);

        // switch enemy weapon visibility
        const w = o.last.weapon || "shotgun";
        const hr = o.humanoid.userData.gunRoot;
        const gs = o.humanoid.userData.gunShot;
        const gm = o.humanoid.userData.gunSmg;
        if (hr && gs && gm) {
          gs.visible = (w === "shotgun");
          gm.visible = (w === "smg");
        }

        const alive = (o.last.hp ?? 100) > 0;
        o.humanoid.traverse(m => { if (m.isMesh) m.material = alive ? m.userData.mat : pDead; });

        if (o.flashLife > 0) {
          o.flashLife = Math.max(0, o.flashLife - dt*18);
          o.flashLight.intensity = o.flashLife * 5;
        }
      }
    }

    // =========================
    // Hit flash
    // =========================
    function triggerHitFlash() {
      hitflash.style.background = "rgba(220,0,0,0.35)";
      setTimeout(() => hitflash.style.background = "rgba(220,0,0,0)", 150);
    }

    // =========================
    // HUD
    // =========================
    const hudHp      = document.getElementById("hud-hp");
    const hudAmmo    = document.getElementById("hud-ammo");
    const hudFace    = document.getElementById("hud-face");
    const hudPlayers = document.getElementById("hud-players");
    const hudRoom    = document.getElementById("hud-room");
    const hudWeapon  = document.getElementById("hud-weapon-name");

    function updateHUD() {
      const hp = Math.max(0, player.hp);
      hudHp.textContent      = hp;
      hudAmmo.textContent    = player.ammo;
      hudPlayers.textContent = others.size + 1;
      hudRoom.textContent    = connected ? `RUM: ${player.room}` : "OFFLINE";
      hudWeapon.textContent  = (currentWeapon === "smg") ? "SMG" : "SHOTGUN";
      hudFace.textContent    = hp > 70 ? "😐" : hp > 40 ? "😬" : hp > 15 ? "😰" : "😵";
      hudHp.style.color      = hp > 50 ? "#ff4400" : hp > 25 ? "#ffaa00" : "#ff0000";
    }

    addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================
    // Game loop
    // =========================
    const clock = new THREE.Clock();
    function tick() {
      const dt = Math.min(0.033, clock.getDelta());

      if (shootCooldown > 0) shootCooldown -= dt;

      // SMG full-auto: skjut så länge musen hålls nere
      if (controls.isLocked && currentWeapon === "smg" && smgTriggerHeld && player.hp > 0) {
        smgShotAcc += dt;
        const interval = 1 / Math.max(0.5, SMG_RPS);

        while (smgShotAcc >= interval) {
          smgShotAcc -= interval;

          const ok = doSingleShot();
          if (!ok) { smgTriggerHeld = false; break; }
          playSound("smg");
        }
      } else {
        smgShotAcc = 0;
      }

      if (controls.isLocked) movePlayer(dt);

      if (connected) {
        inputSendAccum += dt;
        if (inputSendAccum >= 1/30) {
          inputSendAccum = 0;
          const { yaw, pitch } = getYawPitch();
          const inp = computeWorldInput();
          wsSend({ t:"input", ix: inp.ix, iz: inp.iz, yaw, pitch });
        }
      }

      updateOthers(dt);
      updateTracers(dt);
      updateHUD();

      if (muzzleFlashLife > 0) {
        muzzleFlashLife = Math.max(0, muzzleFlashLife - dt*24);
        muzzleLight.intensity = muzzleFlashLife * 4;
        muzzleSpriteMat.opacity = muzzleFlashLife;
        const s = 0.1 + muzzleFlashLife * 0.22;
        muzzleSprite.scale.set(s, s, 1);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
