<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doom-ish PvP (Render: HTML + WS)</title>
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; }
    canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; image-rendering: crisp-edges; }

    #ui {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      font: 16px system-ui, -apple-system, Segoe UI, Roboto, Arial; color:#fff;
      background: rgba(0,0,0,.55);
      user-select:none;
      z-index: 10;
    }
    #ui .box {
      max-width: 780px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.35);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #ui h1 { margin:0 0 10px; font-size: 20px; }
    #ui p { margin:8px 0; opacity:.92; line-height:1.5; }
    #ui .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    #ui label { opacity:.9; }
    #ui input {
      width: 220px; padding: 9px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color:#fff;
      outline:none;
    }
    #ui button {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.14); color:#fff;
      cursor:pointer;
    }
    #ui button:hover { background: rgba(255,255,255,.18); }

    #hud {
      position:fixed; left:12px; top:10px; color:#fff;
      font: 13px ui-monospace, monospace;
      text-shadow: 0 2px 0 #000;
      user-select:none; white-space:pre;
      z-index: 5; pointer-events:none;
      display:none; /* replaced by hud-bar */
    }
    #weapon {
      position: fixed; left: 50%; bottom: 50px;
      transform: translateX(-50%);
      width: min(560px, 75vw);
      height: auto;
      opacity: .97;
      image-rendering: pixelated;
      pointer-events:none;
      filter: drop-shadow(0 8px 0 rgba(0,0,0,.7));
      z-index: 4;
    }
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      width: 0; height: 0;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.92);
    }
    #crosshair::before {
      width: 16px; height: 2px;
      left: -8px; top: -1px;
    }
    #crosshair::after {
      width: 2px; height: 16px;
      left: -1px; top: -8px;
    }

    /* Hit flash overlay */
    #hitflash {
      position: fixed; inset:0;
      pointer-events:none;
      z-index:7;
      background: rgba(220,0,0,0);
      transition: background 0.08s;
    }

    /* Bottom Doom-style HUD bar */
    #hud-bar {
      position: fixed; bottom:0; left:0; right:0;
      height: 56px;
      background: #1a0000;
      border-top: 3px solid #550000;
      display: flex; align-items: center;
      padding: 0 24px;
      gap: 32px;
      z-index: 5;
      pointer-events: none;
      font: bold 28px ui-monospace, monospace;
      color: #ff4400;
      text-shadow: 0 0 8px #ff2200;
    }
    .hud-item { display:flex; flex-direction:column; align-items:center; }
    .hud-label { font-size:9px; letter-spacing:2px; color:#ff6600; opacity:0.7; font-weight:normal; margin-bottom:1px; }
    .hud-value { line-height:1; }
    #hud-face {
      width:44px; height:44px; background:#cc2200;
      border:2px solid #881100; border-radius:2px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px;
    }
    #hud-room {
      font-size:11px; letter-spacing:2px; color:#ff8800;
      opacity:0.6; margin-left:auto; font-weight:normal;
    }
    #toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      color:#fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
      padding: 8px 10px; border-radius: 12px; font: 13px system-ui;
      opacity: 0; transition: opacity .2s ease;
      pointer-events:none;
      z-index: 6;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="ui">
    <div class="box">
      <h1>Doom-ish PvP</h1>
      <p class="row">
        <label>Namn:</label>
        <input id="name" maxlength="16" placeholder="Ditt namn" />
        <label>Rum:</label>
        <input id="room" maxlength="16" value="lobby" />
        <button id="join">Join</button>
      </p>
      <p><b>W</b>=framåt • <b>S</b>=bakåt • <b>A</b>=vänster • <b>D</b>=höger • <b>Mus</b>=sikta • <b>Klick</b>=skjut • <b>ESC</b>=meny</p>
      <p style="opacity:.78">Doom-känsla: hög fart + “slide”. (Inga hopp.)</p>
      <p id="status" style="opacity:.9"></p>
    </div>
  </div>

  <div id="hitflash"></div>
  <div id="hud"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <img id="weapon" alt="weapon" />

  <!-- Doom-style HUD bar -->
  <div id="hud-bar">
    <div class="hud-item">
      <div class="hud-label">HÄLSA</div>
      <div class="hud-value" id="hud-hp">100</div>
    </div>
    <div id="hud-face">😐</div>
    <div class="hud-item">
      <div class="hud-label">AMMO</div>
      <div class="hud-value" id="hud-ammo">50</div>
    </div>
    <div class="hud-item" style="font-size:16px">
      <div class="hud-label">SPELARE</div>
      <div class="hud-value" id="hud-players">–</div>
    </div>
    <div id="hud-room">OFFLINE</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    // =========================
    // WebSocket URL (same origin)
    // =========================
    const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

    // =========================
    // Low-res / Doom-ish rendering
    // =========================
    const INTERNAL_W = 426;
    const INTERNAL_H = 240;

    const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:"high-performance" });
    renderer.setPixelRatio(1);
    renderer.setSize(INTERNAL_W, INTERNAL_H, false);
    renderer.domElement.style.width = "100vw";
    renderer.domElement.style.height = "100vh";
    renderer.domElement.style.imageRendering = "pixelated";
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // Ljusare, mjuk dimma
    scene.fog = new THREE.Fog(0x14121a, 18, 120);

    const camera = new THREE.PerspectiveCamera(75, INTERNAL_W/INTERNAL_H, 0.1, 200);

    // Ljussättning (ljusare än tidigare)
    scene.add(new THREE.AmbientLight(0xffffff, 1.05));
    const key = new THREE.DirectionalLight(0xffffff, 1.15);
    key.position.set(6, 12, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.55);
    fill.position.set(-6, 8, -4);
    scene.add(fill);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    // =========================
    // UI
    // =========================
    const ui = document.getElementById("ui");
    const statusEl = document.getElementById("status");
    const hud = document.getElementById("hud");
    const toast = document.getElementById("toast");
    const weaponImg = document.getElementById("weapon");

    function showToast(text){
      toast.textContent = text;
      toast.style.opacity = "1";
      setTimeout(()=> toast.style.opacity = "0", 900);
    }

    controls.addEventListener("lock", () => { ui.style.display = "none"; });
    controls.addEventListener("unlock", () => { ui.style.display = "flex"; });

    ui.addEventListener("click", (e)=>{
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "LABEL") return;
      if (connected) controls.lock();
    });

    // ── VAPEN SPRITE (detaljerad hagelgevär pixel-art) ──────────────────────
    weaponImg.src = (() => {
      const W = 320, H = 160;
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = false;
      g.clearRect(0,0,W,H);

      const px = (x,y,w,h,col) => { g.fillStyle=col; g.fillRect(x,y,w,h); };

      // Pipa övre (lång)
      px(20,  42, 210, 10, "#111");
      px(21,  43, 208,  4, "#3a3a3a");
      px(21,  43, 208,  2, "#555");
      px(228, 43,   6, 10, "#1a1a1a"); // mynning

      // Pipa undre (magasin-rör)
      px(50,  52, 178, 7,  "#1a1a1a");
      px(51,  53, 176, 3,  "#333");

      // Receiver (kropp)
      px(50,  58, 120, 32, "#1e1e22");
      px(52,  60, 116, 18, "#2a2a30");
      px(54,  61, 112,  8, "#363640");
      // reflex-linje
      px(54,  62, 112,  2, "#4a4a55");

      // Ejection port
      px(90,  60,  30, 14, "#111");
      px(91,  61,  28, 12, "#0a0a0a");

      // Pump-handtag (trä)
      px(120, 58,  45, 32, "#3a2010");
      px(122, 60,  41, 10, "#5a3018");
      px(124, 61,  37,  5, "#7a4820");
      // pump-skruvar
      px(128, 70,   4,  4, "#111");
      px(148, 70,   4,  4, "#111");

      // Kolv (trä)
      px(170, 60,  70, 30, "#2a1808");
      px(172, 62,  66, 12, "#3e2410");
      px(174, 63,  62,  6, "#5a3418");
      // kolv-platta
      px(238, 55,   6, 40, "#111");
      px(239, 56,   4, 38, "#222");

      // Avtryckarbygel
      g.strokeStyle="#333"; g.lineWidth=2;
      g.beginPath(); g.arc(85, 90, 14, 0, Math.PI); g.stroke();
      // Avtryckare
      px(82, 82, 3, 12, "#222");

      // Hand (vänster, pump)
      px(110, 88, 60, 22, "#c07040");
      px(112, 89, 56, 14, "#d08050");
      px(114, 90, 52,  8, "#e09060");
      // fingrar
      for (let fi=0; fi<4; fi++) {
        px(113+fi*13, 102, 10, 14, "#c07040");
        px(114+fi*13, 103,  8,  8, "#d08050");
      }

      // Hand (höger, kolv)
      px(195, 85, 50, 24, "#c07040");
      px(197, 86, 46, 16, "#d08050");
      px(199, 87, 42,  8, "#e09060");
      // fingrar höger
      for (let fi=0; fi<3; fi++) {
        px(196+fi*14, 101, 11, 16, "#c07040");
        px(197+fi*14, 102,  9,  9, "#d08050");
      }

      // Tumme
      px(192, 80, 12, 10, "#c07040");
      px(193, 81, 10,  6, "#d08050");

      return c.toDataURL();
    })();

    // =========================
    // Procedural textures (retro)
    // =========================
    function nearest(tex){
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestMipMapNearestFilter;
      tex.generateMipmaps = true;
      return tex;
    }
    function makeCanvasTexture(w, h, drawFn){
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const g = c.getContext("2d");
      drawFn(g, w, h);
      const tex = new THREE.CanvasTexture(c);
      return nearest(tex);
    }

    const texBrick = makeCanvasTexture(64, 64, (g,w,h)=>{
      g.fillStyle="#2a1b18"; g.fillRect(0,0,w,h);
      const mortar="#140c0b";
      const b1="#6a2a1f", b2="#7a3024", b3="#5e241b";
      for (let y=0; y<8; y++){
        for (let x=0; x<8; x++){
          const bx = x*8 + (y%2?4:0);
          const by = y*8;
          const col = [b1,b2,b3][(x+y)%3];
          g.fillStyle = col; g.fillRect(bx, by, 7, 7);
          g.fillStyle = mortar;
          g.fillRect(bx+7, by, 1, 8);
          g.fillRect(bx, by+7, 8, 1);
        }
      }
      g.globalAlpha=0.22;
      for(let i=0;i<90;i++){
        g.fillStyle = i%2? "#000":"#1b0f0d";
        g.fillRect((Math.random()*w)|0, (Math.random()*h)|0, 2, 1);
      }
      g.globalAlpha=1;
    });

    const texFloor = makeCanvasTexture(64, 64, (g,w,h)=>{
      g.fillStyle="#1a181b"; g.fillRect(0,0,w,h);
      for(let i=0;i<2200;i++){
        const v = 28 + (Math.random()*75)|0;
        g.fillStyle = `rgb(${v},${v},${v})`;
        g.fillRect((Math.random()*w)|0, (Math.random()*h)|0, 1, 1);
      }
      g.globalAlpha=0.25; g.fillStyle="#060607";
      for(let i=0;i<14;i++){
        const x=(Math.random()*w)|0, y=(Math.random()*h)|0;
        g.fillRect(x,y, (Math.random()*10)|0, 1);
      }
      g.globalAlpha=1;
    });

    const texCeil = makeCanvasTexture(64, 64, (g,w,h)=>{
      g.fillStyle="#15141a"; g.fillRect(0,0,w,h);
      g.strokeStyle="rgba(255,255,255,0.06)";
      for(let i=0;i<=8;i++){
        g.beginPath(); g.moveTo(i*8,0); g.lineTo(i*8,h); g.stroke();
        g.beginPath(); g.moveTo(0,i*8); g.lineTo(w,i*8); g.stroke();
      }
      g.globalAlpha=0.18; g.fillStyle="#000";
      for(let i=0;i<220;i++) g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,1,1);
      g.globalAlpha=1;
    });

    // =========================
    // Level (tilemap)
    // =========================
    const cellSize = 4;
    const MAP = [
      "########################",
      "#..........#...........#",
      "#..####....#....####...#",
      "#..#..#.........#..#...#",
      "#..####....##...####...#",
      "#...........#..........#",
      "#..####..#####..####...#",
      "#.....#..#...#..#......#",
      "###...#..#...#..#...####",
      "#.....#..#####..#......#",
      "#..........#...........#",
      "#..####....#....####...#",
      "#..#..#.........#..#...#",
      "#..####....#....####...#",
      "#..........#...........#",
      "########################"
    ];
    const mapH = MAP.length;
    const mapW = MAP[0].length;

    function isWallCell(cx, cz){
      if (cx < 0 || cz < 0 || cx >= mapW || cz >= mapH) return true;
      return MAP[cz][cx] === "#";
    }

    const floorGeo = new THREE.PlaneGeometry(mapW*cellSize, mapH*cellSize);
    const floorMat = new THREE.MeshLambertMaterial({ map: texFloor });
    floorMat.map.repeat.set(mapW*0.75, mapH*0.75);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.set((mapW*cellSize)/2, 0, (mapH*cellSize)/2);
    scene.add(floor);

    const ceilMat = new THREE.MeshLambertMaterial({ map: texCeil, side: THREE.BackSide });
    ceilMat.map.repeat.set(mapW*0.9, mapH*0.9);
    const ceil = new THREE.Mesh(floorGeo, ceilMat);
    ceil.rotation.x = -Math.PI/2;
    ceil.position.set((mapW*cellSize)/2, 6, (mapH*cellSize)/2);
    scene.add(ceil);

    const wallGeo = new THREE.BoxGeometry(cellSize, 6, cellSize);
    const wallMat = new THREE.MeshLambertMaterial({ map: texBrick });
    for (let z=0; z<mapH; z++){
      for (let x=0; x<mapW; x++){
        if (MAP[z][x] === "#"){
          const w = new THREE.Mesh(wallGeo, wallMat);
          w.position.set(x*cellSize + cellSize/2, 3, z*cellSize + cellSize/2);
          scene.add(w);
        }
      }
    }

    // =========================
    // Other players
    // =========================
    function makePlayerSpriteTexture(){
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const g = c.getContext("2d");
      g.clearRect(0,0,64,64);
      const px=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); };
      px(18,10,28,44,"#2b6a7a");
      px(22,18,20,18,"#5aa6b5");
      px(24,22,6,6,"#ffccaa"); px(34,22,6,6,"#ffccaa");
      px(22,40,20,8,"#1a1a1c");
      const tex = new THREE.CanvasTexture(c);
      return nearest(tex);
    }
    const playerTex = makePlayerSpriteTexture();
    const others = new Map();

    function makeNameLabel(name){
      const c = document.createElement("canvas");
      c.width = 256; c.height = 64;
      const g = c.getContext("2d");
      g.clearRect(0,0,256,64);
      g.fillStyle = "rgba(0,0,0,0.35)";
      g.fillRect(0, 8, 256, 40);
      g.font = "22px ui-monospace, monospace";
      g.fillStyle = "#fff";
      g.textAlign = "center";
      g.fillText(name, 128, 36);
      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    function ensureOther(id, name){
      if (others.has(id)) return others.get(id);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: playerTex }));
      sprite.position.set(0, 1.7, 0);
      sprite.scale.set(2.1, 2.1, 1);
      scene.add(sprite);

      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeNameLabel(name), transparent:true }));
      label.position.set(0, 3.3, 0);
      label.scale.set(3.2, 0.8, 1);
      scene.add(label);

      const o = {
        sprite,
        label,
        last: { x:0, z:0, yaw:0, pitch:0, hp:100, name },
        render: { x:0, z:0 }
      };
      others.set(id, o);
      return o;
    }

    function removeOther(id){
      const o = others.get(id);
      if (!o) return;
      scene.remove(o.sprite);
      scene.remove(o.label);
      others.delete(id);
    }

    // =========================
    // Player movement: Doom-ish “slide”
    // =========================
    const keys = new Set();
    addEventListener("keydown", e => keys.add(e.code));
    addEventListener("keyup", e => keys.delete(e.code));

    // Tweakables (more classic Doom feel)
    const MOVE_SPEED = 10.4;    // higher top speed
    const ACCEL_GROUND = 30.0;  // snappier acceleration
    const FRICTION = 10.0;      // lower friction => more sliding
    const STRAFE_BIAS = 1.0;    // keep strafe same speed

    const player = {
      id: null,
      pos: new THREE.Vector3(cellSize*2, 1.7, cellSize*2),
      vel: new THREE.Vector3(),
      radius: 0.55,
      hp: 100,
      ammo: 50,
      room: "lobby"
    };
    controls.getObject().position.copy(player.pos);

    function circleHitsWall(x, z, r){
      const minCX = Math.floor((x - r) / cellSize);
      const maxCX = Math.floor((x + r) / cellSize);
      const minCZ = Math.floor((z - r) / cellSize);
      const maxCZ = Math.floor((z + r) / cellSize);

      for (let cz=minCZ; cz<=maxCZ; cz++){
        for (let cx=minCX; cx<=maxCX; cx++){
          if (!isWallCell(cx,cz)) continue;
          const x0 = cx*cellSize, x1 = x0 + cellSize;
          const z0 = cz*cellSize, z1 = z0 + cellSize;
          const px = Math.max(x0, Math.min(x, x1));
          const pz = Math.max(z0, Math.min(z, z1));
          const dx = x - px, dz = z - pz;
          if (dx*dx + dz*dz < r*r) return true;
        }
      }
      return false;
    }

    function collideAndSlide(newPos){
      const r = player.radius;

      const tryX = new THREE.Vector3(newPos.x, newPos.y, player.pos.z);
      if (!circleHitsWall(tryX.x, tryX.z, r)) player.pos.x = tryX.x;

      const tryZ = new THREE.Vector3(player.pos.x, newPos.y, newPos.z);
      if (!circleHitsWall(tryZ.x, tryZ.z, r)) player.pos.z = tryZ.z;
    }

    // Doom-ish: accelerate towards wish direction (instead of simple lerp)
    function accelerate(vx, vz, wishX, wishZ, wishSpeed, accel, dt){
      const currentSpeed = vx*wishX + vz*wishZ; // dot(v, wishDir)
      const addSpeed = wishSpeed - currentSpeed;
      if (addSpeed <= 0) return { vx, vz };

      let accelSpeed = accel * dt * wishSpeed;
      if (accelSpeed > addSpeed) accelSpeed = addSpeed;

      return { vx: vx + accelSpeed*wishX, vz: vz + accelSpeed*wishZ };
    }

    function applyFriction(vx, vz, friction, dt){
      const speed = Math.hypot(vx, vz);
      if (speed < 1e-6) return { vx:0, vz:0 };

      const drop = speed * friction * dt;
      const newSpeed = Math.max(0, speed - drop);
      const scale = newSpeed / speed;
      return { vx: vx*scale, vz: vz*scale };
    }

    function movePlayer(dt){
      // Camera forward (XZ)
      const forward = new THREE.Vector3();
      controls.getDirection(forward);
      forward.y = 0; forward.normalize();

      // Right vector for strafing
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

      // W=framåt, S=bakåt, A=strafe vänster, D=strafe höger
      let f = 0, s = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp"))    f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown"))  f -= 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft"))  s -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) s += 1;

      // wish direction in world space
      const wish = new THREE.Vector3()
        .addScaledVector(forward, f)
        .addScaledVector(right, s * STRAFE_BIAS);

      let wishSpeed = MOVE_SPEED;
      if (wish.lengthSq() > 0) {
        wish.normalize();
      } else {
        wishSpeed = 0;
      }

      // friction then acceleration (classic-ish)
      const fr = applyFriction(player.vel.x, player.vel.z, FRICTION, dt);
      player.vel.x = fr.vx; player.vel.z = fr.vz;

      if (wishSpeed > 0) {
        const acc = accelerate(player.vel.x, player.vel.z, wish.x, wish.z, wishSpeed, ACCEL_GROUND, dt);
        player.vel.x = acc.vx; player.vel.z = acc.vz;
      }

      // integrate + collide
      const newPos = player.pos.clone().addScaledVector(player.vel, dt);
      newPos.y = 1.7;
      collideAndSlide(newPos);

      controls.getObject().position.copy(player.pos);

      // weapon bob
      const speedNow = Math.hypot(player.vel.x, player.vel.z);
      const bob = Math.sin(perfTime*0.012 + speedNow*0.08) * Math.min(10, speedNow) * 0.09;
      weaponImg.style.transform = `translateX(-50%) translateY(${bob}px)`;
    }

    // =========================
    // Networking
    // =========================
    let ws = null;
    let connected = false;

    function wsSend(obj){
      if (!ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify(obj));
    }

    function connectAndJoin(){
      const name = document.getElementById("name").value || "player";
      const room = document.getElementById("room").value || "lobby";
      player.room = room;

      statusEl.textContent = `Ansluter till ${WS_URL} ...`;
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connected = true;
        statusEl.textContent = "Ansluten. Laddar rum...";
        wsSend({ t:"join", name, room });
      };

      ws.onclose = () => {
        connected = false;
        statusEl.textContent = "Frånkopplad.";
        player.id = null;
        for (const id of [...others.keys()]) removeOther(id);
        ui.style.display = "flex";
      };

      ws.onerror = () => {
        statusEl.textContent = "Fel vid anslutning (kolla Render logs).";
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.t === "welcome") {
          player.id = msg.id;
          player.hp = msg.you.hp;
          player.pos.x = msg.you.x; player.pos.z = msg.you.z;
          controls.getObject().position.copy(player.pos);

          for (const p of msg.players) {
            if (p.id === player.id) continue;
            const o = ensureOther(p.id, p.name);
            o.last = { ...p };
            o.render.x = p.x; o.render.z = p.z;
          }

          showToast(`Joined: ${msg.room}`);
          ui.style.display = "none";
          setTimeout(() => controls.lock(), 50);
          return;
        }

        if (msg.t === "player_join") {
          if (msg.p.id === player.id) return;
          const o = ensureOther(msg.p.id, msg.p.name);
          o.last = { ...msg.p };
          o.render.x = msg.p.x; o.render.z = msg.p.z;
          showToast(`${msg.p.name} joined`);
          return;
        }

        if (msg.t === "player_leave") {
          removeOther(msg.id);
          return;
        }

        if (msg.t === "player_name") {
          const o = ensureOther(msg.id, msg.name);
          o.label.material.map = makeNameLabel(msg.name);
          o.label.material.needsUpdate = true;
          o.last.name = msg.name;
          return;
        }

        if (msg.t === "hit") {
          if (msg.to === player.id) {
            player.hp = msg.hp;
            triggerHitFlash();
            showToast("TRÄFFAD!");
          }
          if (msg.from === player.id) showToast("TRÄFF!");
          const o = others.get(msg.to);
          if (o) o.last.hp = msg.hp;
          return;
        }

        if (msg.t === "respawn") {
          if (msg.id === player.id) {
            player.hp = msg.hp;
            player.pos.x = msg.x; player.pos.z = msg.z;
            player.vel.set(0,0,0);
            controls.getObject().position.copy(player.pos);
            showToast("RESPAWN");
          } else {
            const o = ensureOther(msg.id, (others.get(msg.id)?.last?.name) || "player");
            o.last.x = msg.x; o.last.z = msg.z; o.last.hp = msg.hp;
            o.render.x = msg.x; o.render.z = msg.z;
          }
          return;
        }

        if (msg.t === "state") {
          for (const p of msg.players) {
            if (p.id === player.id) {
              player.hp = p.hp;
              continue;
            }
            const o = ensureOther(p.id, p.name);
            o.last = { ...p };
          }
        }
      };
    }

    document.getElementById("join").addEventListener("click", () => connectAndJoin());

    // =========================
    // Input sending (world-space)
    // =========================
    function getYawPitch(){
      const yaw = controls.getObject().rotation.y;
      const pitch = camera.rotation.x;
      return { yaw, pitch };
    }

    function computeWorldInput(){
      const forward = new THREE.Vector3();
      controls.getDirection(forward);
      forward.y = 0; forward.normalize();

      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

      let f = 0, s = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp"))    f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown"))  f -= 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft"))  s -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) s += 1;

      const v = new THREE.Vector3()
        .addScaledVector(forward, f)
        .addScaledVector(right, s);

      if (v.lengthSq() > 0) v.normalize();
      return { ix: v.x, iz: v.z };
    }

    // shooting
    let shootCooldown = 0;
    addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (!connected || !controls.isLocked) return;
      if (shootCooldown > 0) return;
      if (player.ammo <= 0) { showToast("TOMT! (R = ladda om)"); return; }

      player.ammo--;
      shootCooldown = 0.12;
      triggerMuzzleFlash();

      const { yaw, pitch } = getYawPitch();
      wsSend({ t:"shoot", yaw, pitch });
    });

    // Reload with R
    addEventListener("keydown", e => {
      if (e.code === "KeyR" && controls.isLocked) {
        player.ammo = 50;
        showToast("LADDAT!");
        updateHUD();
      }
    });

    let inputSendAccum = 0;

    // =========================
    // Loop
    // =========================
    const clock = new THREE.Clock();

    function updateOthers(dt){
      const interp = 1 - Math.exp(-18 * dt);
      for (const [id, o] of others) {
        const tx = o.last.x, tz = o.last.z;
        o.render.x += (tx - o.render.x) * interp;
        o.render.z += (tz - o.render.z) * interp;
        o.sprite.position.set(o.render.x, 1.7, o.render.z);
        o.label.position.set(o.render.x, 3.3, o.render.z);

        const hp = o.last.hp ?? 100;
        const shade = hp <= 0 ? 0.25 : 0.95;
        o.sprite.material.color.setScalar(shade);
      }
    }

    // Hit flash
    const hitflash = document.getElementById("hitflash");
    function triggerHitFlash(){
      hitflash.style.background = "rgba(220,0,0,0.35)";
      setTimeout(()=> hitflash.style.background = "rgba(220,0,0,0)", 150);
    }

    // Muzzle flash on weapon
    function triggerMuzzleFlash(){
      weaponImg.style.filter = "drop-shadow(0 8px 0 rgba(0,0,0,.7)) brightness(1.4) saturate(1.5)";
      setTimeout(()=> weaponImg.style.filter = "drop-shadow(0 8px 0 rgba(0,0,0,.7))", 55);
    }

    const hudHp      = document.getElementById("hud-hp");
    const hudAmmo    = document.getElementById("hud-ammo");
    const hudFace    = document.getElementById("hud-face");
    const hudPlayers = document.getElementById("hud-players");
    const hudRoom    = document.getElementById("hud-room");

    function updateHUD(){
      const hp = Math.max(0, player.hp);
      hudHp.textContent   = hp;
      hudAmmo.textContent = player.ammo;
      hudPlayers.textContent = others.size + 1;
      hudRoom.textContent = connected ? `RUM: ${player.room}` : "OFFLINE";

      // Face
      if      (hp > 70) hudFace.textContent = "😐";
      else if (hp > 40) hudFace.textContent = "😬";
      else if (hp > 15) hudFace.textContent = "😰";
      else              hudFace.textContent = "😵";

      // HP color
      hudHp.style.color = hp > 50 ? "#ff4400" : hp > 25 ? "#ffaa00" : "#ff0000";
    }

    function handleResize(){
      const vw = innerWidth, vh = innerHeight;
      camera.aspect = vw / vh;
      camera.updateProjectionMatrix();
      renderer.setSize(INTERNAL_W, INTERNAL_H, false);
      renderer.domElement.style.width = "100vw";
      renderer.domElement.style.height = "100vh";
    }
    addEventListener("resize", handleResize);

    let perfTime = 0;

    function tick(){
      const dt = Math.min(0.033, clock.getDelta());
      perfTime += dt * 1000;

      if (shootCooldown > 0) shootCooldown -= dt;

      if (controls.isLocked){
        movePlayer(dt);
      }

      if (connected) {
        inputSendAccum += dt;
        if (inputSendAccum >= 1/30) {
          inputSendAccum = 0;
          const { yaw, pitch } = getYawPitch();
          const inp = computeWorldInput();
          wsSend({ t:"input", ix: inp.ix, iz: inp.iz, yaw, pitch });
        }
      }

      updateOthers(dt);
      updateHUD();

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
